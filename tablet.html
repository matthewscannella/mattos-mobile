<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CucuBarri">
<meta name="theme-color" content="#0f1218">
<title>CucuBarri</title>
<link rel="apple-touch-icon" href="tablet-icon-180.png">
<link rel="manifest" href="tablet.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<!-- CucuBarri for the iPad A16 in landscape (1180 x 820), from 15🎨-mockups/tabletScreensV3.html. Reads and writes the registry files in the
     private mattos-data repository through the GitHub API, with the phone app's shared functions (index.html). Built in five stages:
     1 Shell and Home, 2 Tasks, 3 Calendar, 4 Weather, and 5 Yoni. -->
<style>
:root{--side:#0f1218;--body:#0a0c11;--tx:#e7e9ee;--hi:#fff;--mut:#8b93a3;--dim:#5f6676;--line:#1c202a;--rule:#232733;--card:#13161d;--raised:#1b202b;--acc:#8dabf9;--blue:#3b6ef5;--done:#3fcf8e;--flag:#f97066;--emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--side);overscroll-behavior:none}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:21px;color:var(--tx);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{all:unset;box-sizing:border-box;cursor:pointer}
input{font:inherit;color:inherit;outline:none;-webkit-user-select:text;user-select:text}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.grow{flex:1;min-width:0}
.e{font-family:var(--emoji)}
/* the frame: pinned to the screen's edges, below the status bar */
.app{position:fixed;inset:0;padding-top:env(safe-area-inset-top);display:flex}
/* sidebar: the dock photo, then the phone's solid tab icons with the blue square on the open one */
.side{width:208px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px calc(16px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px 18px}
.brand img{width:44px;height:44px;border-radius:12px;object-fit:cover;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.brand b{font-size:19px;font-weight:600;letter-spacing:-.01em;color:#fff}
.nv{display:flex;align-items:center;gap:12px;height:52px;padding:0 8px;border-radius:13px;color:var(--mut);font-size:15.5px;font-weight:600}
.nv .w{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;--cut:var(--side)}
.nv.on{color:#fff}
.nv.on .w{background:var(--blue);color:#fff;--cut:var(--blue)}
.nv + .nv{margin-top:4px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--body);padding-right:env(safe-area-inset-right)}
.hd{flex:none;display:flex;align-items:center;gap:14px;padding:14px 22px 12px;min-height:66px}
.hd h1{margin:0;font-size:26px;line-height:32px;font-weight:700;letter-spacing:-.015em;color:#fff}
.hd .dt{font-size:14px;color:var(--mut);padding-top:5px}
.hd .rt{margin-left:auto;display:flex;align-items:center;gap:10px}
.st{font-size:13px;color:var(--dim);padding-top:4px;max-width:420px}
.st.err{color:var(--flag)}
.nowx{display:flex;align-items:center;gap:8px;height:40px;padding:0 13px 0 10px;border-radius:12px;background:var(--card);border:1px solid var(--rule);font-weight:600;color:#fff;--cut:var(--card)}
.body{flex:1;min-height:0;padding:0 22px calc(20px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:14px;--cut:var(--card)}
.ch{display:flex;align-items:center;gap:8px;margin:-2px 0 10px;font-size:14px;font-weight:600;color:var(--tx)}
.ch .hsq{flex:none;width:26px;height:26px;border-radius:8px;background:#172243;color:var(--acc);display:grid;place-items:center;--cut:#172243}
.ch .s{margin-left:auto}
.s{font-size:13px;line-height:18px;color:var(--mut)}
.scroll{overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.empty{padding:6px 0;font-size:13.5px;color:var(--dim)}

/* tasks: the web app's status glyphs and owner avatars */
.sgl{flex:none;display:block}
.glb{flex:none;width:30px;height:30px;margin:-5px;display:grid;place-items:center;border-radius:8px}
.tav{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:600;color:#fff;background:var(--raised)}
.tav.MS{background:linear-gradient(135deg,#3b6ef5,#8b5cf6)}
.tav.BB{background:linear-gradient(135deg,#f472b6,#f59e0b)}
.avs{flex:none;display:flex}
.avs .tav{box-shadow:0 0 0 2px var(--avr,var(--card))}
.avs .tav+.tav{margin-left:-7px}
.lrd{flex:none;font-size:12.5px;color:var(--dim)}
.gone{opacity:0;transform:scale(.97)}
/* Home's task strip: one column per owner */
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;min-height:0;flex:1}
.mc{display:flex;flex-direction:column;min-height:0}
.mch{flex:none;display:flex;align-items:center;gap:8px;padding:0 0 6px;font-size:13px;font-weight:600;color:var(--hi)}
.mch .s{margin-left:auto}
.mr{display:flex;align-items:center;gap:10px;height:34px;border-top:1px solid var(--line);font-size:14px;transition:opacity .3s}

/* calendar rows */
.ev{display:flex;gap:11px;align-items:stretch}
.ev>i{flex:none;width:4px;border-radius:2px;background:var(--blue)}
.ev b{display:block;font-size:16px;line-height:22px;font-weight:600;color:#fff}
.ev span{display:block;font-size:13px;line-height:18px;color:var(--mut)}
.ev+.ev{margin-top:11px}
.ev.past{opacity:.45}
.sub{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:12px 0 8px;margin-top:12px;border-top:1px solid var(--line);display:flex}
.sub .n{margin-left:auto;font-weight:400;letter-spacing:0}

/* weather: the phone's now line and strip, and the score pills */
.wxl{display:flex;align-items:center;gap:14px}
.wxl .v{font-size:44px;line-height:48px;font-weight:700;letter-spacing:-.02em;color:#fff}
.wxl .t1{font-weight:600;color:#fff;display:flex;align-items:center;gap:7px}
.wk{display:grid;gap:4px}
/* the hour strip runs a day ahead and scrolls sideways, n hours at a time */
.wk.hsx{grid-auto-flow:column;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain}
.wc{white-space:nowrap;display:grid;justify-items:center;gap:5px;padding:10px 0 9px;border-radius:14px;font-size:12.5px;line-height:16px;color:var(--mut);--cut:var(--card)}
.wc b{font-size:18px;line-height:22px;color:var(--tx);font-weight:700}
.wc svg{color:var(--tx)}
.wc.on{background:var(--blue);color:rgba(255,255,255,.85);--cut:var(--blue)}
.wc.on b,.wc.on svg{color:#fff}
.hp{display:grid;gap:4px;justify-items:center;font-size:13px;line-height:17px;color:var(--mut);--cut:var(--card)}
.hp>b{font-weight:600;color:var(--tx);margin-top:4px}
.hp.td>b{color:var(--acc)}
.hpp{width:100%;display:grid;gap:2px}
.sg{height:var(--h,64px);display:grid;place-items:center;font-size:var(--f,15px);font-weight:600;color:#fff;background:color-mix(in srgb,var(--done) var(--a,0%),var(--raised))}
.sg.lo{color:var(--mut)}
.sg:first-child{border-radius:9px 9px 0 0}
.sg:last-child{border-radius:0 0 9px 9px}
.sg.gone{opacity:1;transform:none;background:none;border:1px dashed #2f3544;cursor:default}

/* Yoni */
.ynow{height:20px;padding:0 8px;border-radius:10px;font-size:11.5px;font-weight:600;display:grid;place-items:center;background:rgba(59,110,245,.2);color:var(--acc)}
.ysub{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:10px 0 4px;border-top:1px solid var(--line);display:flex}
.ysub .n{margin-left:auto;font-weight:400;letter-spacing:0}
.ysub.on{color:var(--done)}
.rw{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:5px 0;font-size:15px;line-height:20px}
.rw+.rw,.ysub+.rw{border-top:1px solid var(--line)}
.rw .wh{flex:none;width:66px;font-size:13px;font-weight:600;color:var(--acc)}
.rw.done .tx,.rw.done .wh{color:var(--mut)}
.rw.done .tx{text-decoration:line-through}
.box{flex:none;width:20px;height:20px;border:1.5px solid var(--mut);border-radius:6px;display:grid;place-items:center;color:var(--body)}
.box.rd{border-radius:50%}
.box.on{background:var(--done);border-color:var(--done)}

/* Tasks: the web board's toolbar (+ Filter and its chips, List and Board, Display), lanes of cards or rows, and the edit sheet */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:12px;background:var(--card);border:1px solid var(--rule)}
.seg button{text-align:center;height:34px;line-height:34px;padding:0 16px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--blue);color:#fff}
.tool{flex:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--mut)}
.tbar{flex:none;display:flex;align-items:center;gap:8px;padding:0 22px 12px}
.tb{height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border-radius:12px;border:1px solid var(--rule);background:var(--card);font-size:14px;font-weight:600;color:var(--tx);white-space:nowrap;--cut:var(--card)}
.tb.ghost{border-style:dashed;background:none;color:var(--mut)}
.tb.on{border-color:var(--blue);background:#172243;color:var(--acc);--cut:#172243}
.fchip{height:42px;display:inline-flex;align-items:center;gap:7px;max-width:280px;padding:0 4px 0 13px;border:1px solid var(--rule);border-radius:12px;background:var(--card);font-size:14px;color:var(--tx)}
.fchip .k{flex:none;color:var(--mut)}
.fchip button{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--mut)}
.popdim{position:absolute;inset:0;z-index:4}
.pop{position:absolute;top:120px;z-index:5;background:var(--side);border:1px solid var(--rule);border-radius:18px;padding:10px 12px 12px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.pop-h{padding:8px 4px 6px;font-size:12px;line-height:14px;font-weight:600;color:var(--mut)}
.fcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 14px}
.pi{display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 8px;border-radius:10px;font-size:15px;color:var(--tx)}
.pi.on{background:#172243}
.dsw{display:flex;align-items:center;justify-content:space-between;width:100%;height:48px;margin-top:6px;padding:0 4px;border-top:1px solid var(--line);font-size:15px;color:var(--tx)}
.dsw i{flex:none;position:relative;width:44px;height:26px;border-radius:13px;background:var(--rule)}
.dsw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mut);transition:left .15s}
.dsw.on i{background:var(--blue)}
.dsw.on i::after{left:21px;background:#fff}
.lbd{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(286px,1fr);gap:12px;height:100%;overflow-x:auto}
.is-done{opacity:.5}
.is-done .lct,.is-done .lrt{text-decoration:line-through}
.lrc{flex:none;height:26px;line-height:24px;padding:0 9px;border-radius:7px;border:1px solid var(--rule);font-size:12.5px;color:var(--mut)}
.lrc.today{color:var(--done)}
.lcol{display:flex;flex-direction:column;min-height:0;padding:4px;border-radius:14px;background:rgba(255,255,255,.015);--avr:var(--body)}
.lch{flex:none;display:flex;align-items:center;gap:9px;height:44px;padding:0 4px 0 10px;font-size:13.5px;color:var(--mut)}
.lch b{font-size:15px;font-weight:500;color:var(--hi)}
.lcl{flex:1;min-height:0;display:grid;align-content:start;gap:8px;padding-bottom:6px}
.lc{display:grid;gap:5px;padding:12px 14px 11px;border-radius:11px;background:var(--card);border:1px solid var(--line);transition:opacity .3s,transform .3s;--avr:var(--card)}
.lc.sel{border-color:var(--blue);background:#141927}
.sep{margin:0 5px;color:var(--dim)}
.lct{font-size:15px;line-height:20px;font-weight:500;color:var(--hi)}
.lcn{font-size:13px;line-height:17px;color:var(--dim)}
/* the card's foot: its status, timing, and owner on one line */
.lcf{display:flex;align-items:center;gap:9px;margin-top:3px;font-size:12.5px;color:var(--mut)}
.lcf .today{color:var(--done)}
/* the New task button, bottom right of every tab */
.fab{position:absolute;right:calc(22px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));z-index:3;width:56px;height:56px;border-radius:16px;background:var(--blue);display:grid;place-items:center;color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.5)}
.addc{justify-self:start;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--dim)}
.ll{height:100%;border:1px solid var(--rule);border-radius:16px;background:var(--body)}
.band{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:10px;height:42px;padding:0 10px 0 16px;background:var(--card);border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}
.lgrp+.lgrp .band{border-top:1px solid var(--line)}
/* drag and drop: a long press lifts a card or row; the dashed box shows where it will land */
.dghost{position:fixed;left:0;top:0;z-index:9;pointer-events:none;margin:0;background:var(--card);border:1px solid var(--blue);border-radius:11px;box-shadow:0 18px 40px rgba(0,0,0,.55);opacity:.96;--avr:var(--card)}
.dph{flex:none;border:1.5px dashed var(--blue);border-radius:11px;background:rgba(59,110,245,.08)}
.band b{font-size:14px;font-weight:500;color:var(--hi)}
.band.today b{color:var(--done)}
.lr{display:flex;align-items:center;gap:14px;height:50px;padding:0 16px 0 18px;border-bottom:1px solid var(--line);border-left:2px solid transparent;transition:opacity .3s;--avr:var(--body)}
.lr.sel{background:#141927;border-left-color:var(--blue)}
.lrt{flex:none;max-width:42%;font-size:15px;font-weight:500;color:var(--hi)}
.lrn{font-size:13px;color:var(--dim)}
/* the sheet sits high, so the keyboard does not cover it */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.58);z-index:4}
.bs{position:absolute;left:50%;top:24px;transform:translateX(-50%);width:520px;z-index:5;display:grid;gap:14px;background:var(--side);border:1px solid var(--rule);border-radius:22px;padding:18px 20px 20px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.bs h3{margin:0;font-size:18px;font-weight:600;color:#fff;display:flex;align-items:center}
.bs h3 button{margin-left:auto;font-size:14px;color:var(--mut);font-weight:500}
.fl{display:grid;gap:6px}
.fl>span{font-size:12px;line-height:14px;font-weight:600;color:var(--mut)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.o{height:34px;padding:0 12px;border-radius:9px;background:var(--raised);color:var(--mut);font-size:14px;font-weight:600;display:inline-flex;align-items:center}
.o.on{background:var(--blue);color:#fff}
.fb{display:flex;gap:8px;margin-top:4px}
.fb .btn{flex:1}
.fb .btn.del{flex:none;background:var(--raised);color:var(--flag);display:flex;align-items:center;gap:6px}
.toast{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);width:440px;display:flex;align-items:center;gap:12px;background:var(--raised);border:1px solid var(--rule);border-radius:12px;padding:10px 12px 10px 16px;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:6}
.toast span{flex:1}
.toast button{color:var(--acc);font-weight:600;padding:4px 6px}
/* the phone's win toast (index.html .win), larger: a green bar where the toast sits whose emoji pops, and confetti once Yoni's day is done */
.win{position:fixed;inset:0;z-index:9;pointer-events:none;overflow:hidden}
.win[hidden]{display:none}
.wst{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));width:440px;margin-left:-220px;display:flex;align-items:center;gap:14px;background:#10261d;border:1px solid #1f5a3f;border-radius:14px;padding:12px 16px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:wIn .3s ease-out both,wOut .3s ease-in 3.1s forwards}
.wst b{display:block;font-size:16px;line-height:20px;font-weight:600;color:var(--hi)}
.wst small{display:block;font-size:14px;line-height:18px;color:#8fd9b6}
.wst .em{flex:none;font-size:32px;line-height:1;font-family:var(--emoji);animation:wPop .5s ease-out .1s both}
.wcf i{position:absolute;top:0;width:9px;height:14px;border-radius:2px;animation:wFall 2.8s ease-in both}
@keyframes wIn{from{opacity:0;transform:translateY(14px)}}
@keyframes wOut{to{opacity:0;transform:translateY(14px)}}
@keyframes wPop{0%{transform:scale(.2)}60%{transform:scale(1.35)}100%{transform:none}}
@keyframes wFall{0%{opacity:0;transform:translateY(-40px) rotate(0)}8%,80%{opacity:1}100%{opacity:0;transform:translateY(105vh) rotate(540deg)}}

/* Calendar: the header's week buttons, then the mockup's Day timeline and the web app's week grid (mattOs.css ~501-512, ~846-872) */
.nb{flex:none;width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--rule);display:grid;place-items:center;color:var(--tx)}
.nb.off{opacity:.3;pointer-events:none}
.tdy{height:42px;line-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--rule);font-size:14px;font-weight:600;color:var(--acc)}
.tdy.off{visibility:hidden}
.tl{position:relative;margin-left:52px}
.tl .hr{position:absolute;left:-52px;right:0;height:1px;background:var(--line);font-size:11.5px;color:var(--mut)}
.tl .hr span{position:absolute;left:0;top:-8px;width:44px;text-align:right}
.tl .nw{position:absolute;left:-6px;right:0;height:2px;background:var(--flag);z-index:2}
.tl .nw::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--flag)}
.blk{position:absolute;left:8px;right:8px;z-index:1;border-radius:10px;padding:6px 10px;background:rgba(59,110,245,.18);border-left:4px solid var(--blue);font-size:13px;line-height:17px;color:var(--mut);overflow:hidden}
.blk b{display:block;font-size:14.5px;line-height:19px;color:#fff;font-weight:600}
.blk.past{opacity:.5}
.cgw{position:relative;height:100%}
.cg{display:grid;grid-template-columns:64px repeat(7,minmax(0,1fr));grid-template-rows:44px auto auto;background:var(--card);border:1px solid var(--rule);border-radius:16px;overflow:hidden;--cut:var(--card)}
.cgh{display:flex;align-items:baseline;gap:7px;padding:0 10px;line-height:43px;border-bottom:1px solid var(--rule);border-left:1px solid var(--line);font-size:13px;color:var(--mut)}
.cgh b{font-size:19px;font-weight:600;color:var(--tx)}
.cgh.td{background:rgba(59,110,245,.14);box-shadow:inset 0 -2px 0 var(--blue);color:var(--acc)}
.cgh.td b{color:var(--acc)}
.cgh.we,.dcol.we{background-color:rgba(255,255,255,.025)}
.adl{font-size:11px;line-height:31px;color:var(--mut);padding-right:8px;text-align:right;border-bottom:1px solid var(--rule)}
.adr{grid-column:2/-1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;min-height:32px;padding:4px;border-bottom:1px solid var(--rule);border-left:1px solid var(--rule)}
.adev{font-size:12px;line-height:22px;font-weight:500;padding:0 8px;border-radius:6px;background:rgba(59,110,245,.18);color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrs{position:relative}
.hrs span{position:absolute;right:8px;font-size:11px;line-height:14px;color:var(--mut)}
.hrs em{position:absolute;left:0;width:22px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-style:normal;font-size:10.5px;color:var(--mut);border-right:1px solid var(--rule)}

<script>
/* ---------- icons: the phone's solid style (index.html ~453-463) ---------- */
const F = 'fill="currentColor" stroke="none"', C = 'fill="none" stroke="var(--cut)" stroke-width="2"';

const K = w => `fill="none" stroke="currentColor" stroke-width="${w}"`;
const svg = (inner, s = 24, w = 2) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const cloudD = "M17.5 19a4.5 4.5 0 0 0 .5-8.97A6 6 0 0 0 6.3 11.5 3.8 3.8 0 0 0 7 19z";
const WXI = {
  sun: `<circle ${F} cx="12" cy="12" r="5"/><path ${K(2.6)} d="M12 2v1.5M12 20.5V22M4.9 4.9 6 6M18 18l1.1 1.1M2 12h1.5M20.5 12H22M4.9 19.1 6 18M18 6l1.1-1.1"/>`,
  part: `<circle ${F} cx="8.5" cy="7.5" r="4.8"/><path fill="currentColor" stroke="var(--cut)" stroke-width="2" d="M17.5 21.5a4.5 4.5 0 0 0 .5-8.97A6 6 0 0 0 6.5 14 3.8 3.8 0 0 0 7 21.5z"/>`,

};
const TAB = {
  Home: `<path ${FS} d="M12 3 2.5 11h2.5v9.5h14V11h2.5z"/><rect ${CF} x="10" y="14" width="4" height="7.5" rx="1"/>`,
  Tasks: `<rect ${F} x="4" y="4" width="16" height="18" rx="3"/><rect fill="currentColor" stroke="var(--cut)" stroke-width="1.8" x="8.5" y="1.8" width="7" height="5" rx="1.8"/><path ${C} d="m8.5 14.3 2.4 2.4 4.6-5"/>`,
  Calendar: `<rect ${F} x="2.5" y="3.5" width="19" height="18" rx="3"/><path ${C} d="M2.5 9.5h19"/><path fill="none" stroke="var(--cut)" stroke-width="2.6" d="M7.5 13.5h.01M12 13.5h.01M16.5 13.5h.01M7.5 17.5h.01M12 17.5h.01"/>`,

};
const UI = {
  check: `<path d="m5 12.5 4.5 4.5L19 7"/>`, left: `<path d="m15 5-7 7 7 7"/>`, right: `<path d="m9 5 7 7-7 7"/>`, plus: `<path d="M12 5v14M5 12h14"/>`, x: `<path d="M6 6l12 12M18 6 6 18"/>`,
  display: `<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>`,
  trash: `<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5a1.5 1.5 0 0 0 1.5 1.5h7a1.5 1.5 0 0 0 1.5-1.5L18 7M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7"/>`
};
/* Linear's status glyphs, as the web app's SGLYPH (screens.js ~1180) */
const SGLYPH = {
  Open: '<circle cx="7" cy="7" r="5.6" fill="none" stroke="#8b93a3" stroke-width="1.5"/>',
  WIP: '<circle cx="7" cy="7" r="5.6" fill="none" stroke="#f5a524" stroke-width="1.5"/><path d="M7 3.6A3.4 3.4 0 0 1 7 10.4Z" fill="#f5a524"/>',
  Blocked: '<circle cx="7" cy="7" r="5.6" fill="none" stroke="#f97066" stroke-width="1.5"/><path d="M4.4 7h5.2" stroke="#f97066" stroke-width="1.6" stroke-linecap="round"/>',
  Done: '<circle cx="7" cy="7" r="6.4" fill="#3fcf8e"/><path d="M4.4 7.1l1.8 1.8 3.4-3.6" fill="none" stroke="#06130d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'
};
const sGlyph = (l, s = 18) => `<svg class="sgl" width="${s}" height="${s}" viewBox="0 0 14 14">${SGLYPH[l]}</svg>`;
TAB.Shopping = `<path ${F} d="M1.5 3.5a1.2 1.2 0 0 1 1.2-1.2h1.6a1.6 1.6 0 0 1 1.55 1.2l.35 1.3h14.6a1.2 1.2 0 0 1 1.15 1.5l-1.9 7.2a2 2 0 0 1-1.95 1.5H8.4l.4 1.5h10a1.2 1.2 0 0 1 0 2.4H8.3a1.6 1.6 0 0 1-1.55-1.2L3.9 4.7H2.7a1.2 1.2 0 0 1-1.2-1.2z"/><circle ${F} cx="9" cy="20.5" r="1.8"/><circle ${F} cx="18" cy="20.5" r="1.8"/>`;
const NAV = ["Home", "Tasks", "Shopping", "Calendar", "Weather", "Yoni"];

const $ = id => document.getElementById(id);
const esc = s => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const stamp = () => { const d = new Date(), h = d.getHours(), m = d.getMinutes(); return `${d.toLocaleString("en-US", { month: "short" })} ${d.getDate()}, ${d.getFullYear()}, ${h % 12 || 12}${m ? ":" + String(m).padStart(2, "0") : ""}${h < 12 ? "am" : "pm"}`; };
let stMsg = "", stKind = "";
function status(msg, kind = "") { stMsg = msg; stKind = kind; const e = $("st"); if (e) { e.textContent = msg; e.className = "st ell" + (kind === "err" ? " err" : ""); } }

/* ---------- GitHub: the phone app's shared functions (index.html ~482-544), with the same mattos- names in this browser ---------- */
const store = {
  get: k => { try { return localStorage.getItem("mattos-" + k) || ""; } catch (e) { return ""; } },
  set: (k, v) => { try { localStorage.setItem("mattos-" + k, v); } catch (e) { /* private mode: lasts until the tab closes */ } }
};
const cfg = () => ({ owner: store.get("owner") || "matthewscannella", repo: store.get("repo") || "mattos-data", token: store.get("token") });
const b64decode = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));
const b64encode = text => { const bytes = new TextEncoder().encode(text); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(bin); };
const apiUrl = path => { const c = cfg(); return `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}`; };
const headers = () => ({ Authorization: `Bearer ${cfg().token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" });
const keep = (path, text) => store.set("file-" + path, JSON.stringify({ text, at: stamp() }));
async function fetchFile(path) {
  const r = await fetch(apiUrl(path) + "?ref=main&t=" + Date.now(), { headers: headers(), cache: "no-store" });
  if (r.status === 401) throw new Error("The token was rejected. Paste a new one.");
  if (r.status === 404) throw new Error(`${path.split("/").pop()} was not found. Check that the laptop has synced once.`);
  if (!r.ok) throw new Error(`GitHub returned ${r.status}.`);
  const j = await r.json(), text = b64decode(j.content);
  keep(path, text);
  return { text, sha: j.sha };
}
async function putFile(path, text, sha, message) {
  const r = await fetch(apiUrl(path), { method: "PUT", headers: { ...headers(), "Content-Type": "application/json" }, body: JSON.stringify({ message, content: b64encode(text), sha, branch: "main" }) });
  if (r.status === 409 || r.status === 422) return null; /* someone else saved first: caller retries on the newer file */
  if (!r.ok) throw new Error(r.status === 403 ? "The token can't write to this repository. Give it Contents: Read and write." : `Save failed: GitHub returned ${r.status}.`);
  keep(path, text);
  return (await r.json()).content.sha;
}
/* the newest file, or the copy kept from the last load when there is no connection. Nothing is edited from a kept copy */
let offline = false;
const kept = path => { try { return JSON.parse(store.get("file-" + path)); } catch (e) { return null; } };
async function readFile(path) {
  try { const f = await fetchFile(path); offline = false; return f; }
  catch (e) {
    if (!(e instanceof TypeError)) throw e;
    const k = kept(path);
    if (!k) throw new Error("No connection, and nothing has been loaded on this iPad yet.");
    offline = true;
    return { text: k.text, sha: null, at: k.at };
  }
}
/* every save starts from the newest file on GitHub and changes only its own part, so laptop edits to the rest are kept */
let saving = Promise.resolve();
function commitFile(path, parse, serialize, change, message, onSaved) {
  saving = saving.then(async () => {
    status("Saving…");
    for (let attempt = 0; attempt < 4; attempt++) {
      const latest = await fetchFile(path);
      const list = parse(latest.text);
      const item = change(list);
      const text = serialize(list);
      if (text === latest.text) { if (onSaved) onSaved(item, list); status("Saved", "ok"); return item; }
      const newSha = await putFile(path, text, latest.sha, message);
      if (newSha) { if (onSaved) onSaved(item, list); status("Saved " + stamp().split(", ").pop(), "ok"); return item; }

  if (!sh.edit) return "";
  return `<div class="dim" data-close></div><div class="bs"><h3>Edit item<button data-close>Cancel</button></h3>
    <label class="fl"><span>Name</span><input class="in" id="shName" value="${esc(sh.edit.v)}" placeholder="Item name" enterkeyhint="done"></label>
    <div class="fb"><button class="btn del" data-shdel="${esc(sh.edit.name)}">${svg(UI.trash, 18, 2)}Delete</button><button class="btn" data-shsave>Save</button></div></div>`;
}
function shSave() {

const toast = () => undoCard ? `<div class="toast"><span class="ell">${undoCard.done ? "Checked off" : "Task deleted"}</span><button data-undo>Undo</button></div>` : "";

/* the sheet's typed text is kept before every redraw */
function keepText() { const n = $("fName"), t = $("fNote"), s = $("shName"); if (n && ts.f) { ts.f.title = n.value; ts.f.note = t.value; } if (s && sh.edit) sh.edit.v = s.value; }
function openSheet(r, add) {
  ts.pop = null;
  if (r) { ts.edit = r.n; ts.r = r; ts.f = { st: r.st, owner: r.owner, time: r.time, title: r.title, note: r.note }; }
  else { const [g, k] = add.split(":"); ts.edit = "new"; ts.r = null; ts.f = { st: g === "Status" ? k : "Open", owner: g === "Owner" ? k : "MS", time: g === "Timing" ? k : dayName(), title: "", note: "" }; }

/* ---------- Calendar: Week (the web app's grid, lifeSections.js ~1474-1500) and Day, with the Weather toggle's score tiles ---------- */
/* an event's hours as [start, end], or null for an all-day one */
const evSpan = e => { const s = tH(e.start); if (s === null) return null; const en = tH(e.end); return [s, en === null || en === s ? s + .5 : en < s ? 24 : en]; };
/* an all-day "..., through Fri Oct 9" runs to that day */
const evUntil = e => { const m = e.title.match(/through (?:[A-Z][a-z]{2} )?([A-Z][a-z]{2}) (\d{1,2})/), k = m ? MONTHS.indexOf(m[1]) : -1; if (k < 0) return e.d; const y = +e.d.slice(0, 4), s = `${y + (k + 1 < +e.d.slice(5, 7) ? 1 : 0)}-${p2(k + 1)}-${p2(+m[2])}`; return s > e.d ? s : e.d; };
const wxHit = (sp, b) => !!sp && sp[0] < b.to && sp[1] > b.from;
const hasTile = (s, j) => view.calwx && W && !!wxBlock(s, WX_BLOCKS[j]);
const halfEv = (s, sp) => WX_BLOCKS.some((b, j) => hasTile(s, j) && wxHit(sp, b));
function wxTile(s, j, H, from, half) {
  const b = WX_BLOCKS[j], B = view.calwx && W && wxBlock(s, b);
  if (!B) return "";
  const a = wxFill(B.score), k = `${s},${j}`;
  return `<button class="pwx${a ? " on" : ""}${a > .6 ? " hot" : ""}${half ? " half" : ""}${cs.cwx === k ? " sel" : ""}" data-cwx="${k}" style="top:${(b.from - from) * H + 2}px;height:${(b.to - b.from) * H - 4}px;--a:${Math.round(a * 70)}%;--b:${Math.round(a * 70 + 15)}%">${wxIco(wxIcon(B.code), 18)}<b class="num">${half ? `${B.lo}-${B.hi}` : `${B.lo} to ${B.hi}`}°</b><span class="num">${half ? "" : "Rain "}${B.p}%</span></button>`;
}
const wxBtn = () => `<button class="tb${view.calwx ? " on" : ""}" data-calwx>${wxIco("part", 20)}Weather</button>`;
const md = s => fmtDay(s, { month: "short", day: "numeric" });
function calDay() {
  const H = 44, from = 7, n = 16, td = today(), now = nowH(), evs = cal.events.filter(e => e.d === td && evSpan(e));
  const tiles = WX_BLOCKS.map((b, j) => wxTile(td, j, H, from, evs.some(e => wxHit(evSpan(e), b)))).join("");
  const blocks = evs.map(e => { const [s, en] = evSpan(e), top = Math.max(0, (s - from) * H); return `<div class="blk${calWho(e)}${en <= now ? " past" : ""}${halfEv(td, [s, en]) ? " half" : ""}" style="top:${top + 1}px;height:${Math.max((en - Math.max(s, from)) * H - 3, 30)}px">${en - s < 1 ? `<b class="ell">${esc(e.title)} <span class="num" style="font-weight:400;color:var(--mut)">${esc(e.start)}</span></b>` : `<b>${esc(e.title)}</b><span class="num">${esc(e.start)} to ${esc(e.end)}</span>`}</div>`; }).join("");
  const later = cal.events.filter(e => e.d === td && (tH(e.start) ?? -1) > now), tm = addDays(td, 1), allDay = cal.events.filter(e => e.d <= td && evUntil(e) >= td && !evSpan(e));
  const sel = view.calwx && cs.cwx && cs.cwx.startsWith(td) ? `<section class="card">${wxHead(cs.cwx)}</section>` : "";
  return `<div style="display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;height:100%">
    <section class="card scroll" style="padding:18px 14px 10px 10px">${allDay.map(e => `<div class="adev${calWho(e)}" style="margin:0 0 8px 52px">${esc(e.title)}</div>`).join("")}<div class="tl" style="height:${n * H}px">${Array.from({ length: n }, (_, i) => `<div class="hr" style="top:${i * H}px"><span class="num">${hr12(from + i)}</span></div>`).join("")}
      ${tiles}${now >= from && now < from + n ? `<div class="nw" style="top:${(now - from) * H}px"></div>` : ""}${blocks}</div></section>
    <div class="scroll" style="display:grid;align-content:start;gap:12px">${sel}<section class="card"><div class="ch">Coming up today<span class="s num">${later.length} left</span></div>${later.map(e => evRow(e, true)).join("") || '<div class="empty">Nothing else today.</div>'}</section>
      <section class="card"><div class="ch">Tomorrow<span class="s">${fmtDay(tm, { weekday: "short", month: "short", day: "numeric" })}</span></div>${cal.events.filter(e => e.d === tm).map(e => evRow(e)).join("") || '<div class="empty">Nothing on the calendar.</div>'}</section></div></div>`;
}
/* Monday to Sunday, 8 AM to 8 PM, the blocks named down the hour column; the registry holds four weeks */
function calWeek() {
  const H = 52, F = 8, T = 20, td = today(), now = nowH(), mon = addDays(td, -((atNoon(td).getDay() + 6) % 7) + 7 * cs.wk), days = Array.from({ length: 7 }, (_, j) => addDays(mon, j));
  const we = s => [0, 6].includes(atNoon(s).getDay());
  const heads = days.map(s => `<div class="cgh${s === td ? " td" : ""}${we(s) ? " we" : ""}"><span>${fmtDay(s, { weekday: "short" })}</span><b class="num">${+s.slice(8)}</b></div>`).join("");
  const ad = cal.events.filter(e => !evSpan(e) && e.d <= days[6] && evUntil(e) >= mon), per = days.map(s => ad.filter(e => e.d <= s && evUntil(e) >= s).length), adH = Math.max(32, 9 + Math.max(0, ...per) * 26 - 4);
  const allday = `<div class="adl">All day</div><div class="adr">${ad.map(e => { const a = Math.max(0, days.indexOf(e.d < mon ? mon : e.d)), u = evUntil(e), z = u > days[6] ? 6 : days.indexOf(u); return `<div class="adev${calWho(e)}" style="grid-column:${a + 1}/${Math.max(a, z) + 2}">${esc(e.title)}</div>`; }).join("")}</div>`;
  const hours = Array.from({ length: T - F }, (_, i) => `<span class="num" style="top:${i * H + 4}px">${hr12(F + i)}</span>`).join("") + WX_BLOCKS.map(b => `<em style="top:${(b.from - F) * H}px;height:${(b.to - b.from) * H}px">${b.label}</em>`).join("");
  const cols = days.map(s => {
    const evs = cal.events.filter(e => e.d === s && evSpan(e));
    return `<div class="dcol${s === td ? " td" : ""}${we(s) ? " we" : ""}" style="height:${(T - F) * H}px;background-size:100% ${H}px">${[4, 8].map(h => `<i class="bline" style="top:${h * H - 1}px"></i>`).join("")}
      ${WX_BLOCKS.map((b, j) => wxTile(s, j, H, F, evs.some(e => wxHit(evSpan(e), b)))).join("")}
      ${evs.map(e => { const [a, z] = evSpan(e), s0 = Math.min(Math.max(a, F), T - .5), e0 = Math.max(Math.min(z, T), s0 + .5), past = s < td || (s === td && z <= now);
        return `<div class="cev${calWho(e)}${halfEv(s, [a, z]) ? " half" : ""}${past ? " past" : ""}" style="top:${(s0 - F) * H + 1}px;height:${Math.max((e0 - s0) * H - 3, 22)}px"><b class="ell">${esc(e.title)}</b>${e0 - s0 >= .75 ? `<span class="num ell">${esc(e.start)}</span>` : ""}</div>`; }).join("")}
      ${s === td && now >= F && now < T ? `<div class="cnow" style="top:${(now - F) * H}px"></div>` : ""}</div>`;
  }).join("");
  /* the open tile's hours, beside it: to its right on Monday to Thursday, to its left after; the evening one sits on the grid's floor */
  let pop = "";
  if (view.calwx && cs.cwx && days.includes(cs.cwx.split(",")[0])) {
    const [s, b] = cs.cwx.split(","), j = days.indexOf(s), x = j >= 4 ? `right:calc((100% - 64px) / 7 * ${7 - j} + 6px)` : `left:calc(64px + (100% - 64px) / 7 * ${j + 1} + 6px)`;
    pop = `<div class="wxp" style="${x};${+b === 2 ? "bottom:6px" : `top:${44 + adH + (WX_BLOCKS[+b].from - F) * H}px`}">${wxHead(cs.cwx)}</div>`;
  }
  return `<div class="cgw"><div class="cg"><div></div>${heads}${allday}<div class="hrs">${hours}</div>${cols}</div>${pop}</div>`;
}
function calendarScreen() {
  const wk = view.cal === "Week", mon = addDays(today(), -((atNoon(today()).getDay() + 6) % 7) + 7 * cs.wk), sun = addDays(mon, 6);
  const right = wxBtn() + (wk ? `<button class="tdy${cs.wk ? "" : " off"}" data-wk="0">This week</button><button class="nb${cs.wk > 0 ? "" : " off"}" data-wk="${cs.wk - 1}" aria-label="Last week">${svg(UI.left, 20, 2.4)}</button><button class="nb${cs.wk < 3 ? "" : " off"}" data-wk="${cs.wk + 1}" aria-label="Next week">${svg(UI.right, 20, 2.4)}</button>` : "");
  const date = wk ? (mon.slice(5, 7) === sun.slice(5, 7) ? `${md(mon)} to ${+sun.slice(8)}` : `${md(mon)} to ${md(sun)}`) : undefined;
  return head("Calendar", `<div style="margin-left:24px">${segBar(["Week", "Day"], view.cal, "cal")}</div>`, right, date) + `<div class="body${wk ? " scroll" : ""}">${wk ? calWeek() : calDay()}</div>`;

const SCREENS = { Home: homeScreen, Tasks: tasksScreen, Shopping: shopScreen, Calendar: calendarScreen, Weather: weatherScreen, Yoni: yoniScreen };

/* ---------- router and loading ---------- */
let tab = NAV.includes(location.hash.slice(1)) ? location.hash.slice(1) : "Home", setupMsg = null;
function draw() {
  if (dg && dg.on) return; /* a lifted card is not drawn over; the drop redraws */
  keepText();
  $("side").innerHTML = sideBar();
  const sc = [...document.querySelectorAll("#main .scroll")].map(e => [e.scrollTop, e.scrollLeft]);
  $("main").innerHTML = setupMsg !== null ? setupScreen(setupMsg) : SCREENS[tab]() + (tab === "Shopping" ? "" : `<button class="fab" data-add="Status:Open" aria-label="New task">${svg(UI.plus, 26, 2.4)}</button>`) + `${sheet()}${shSheet()}${toast()}`;
  const si = $("shIn"); if (si) si.focus();
  document.querySelectorAll("#main .scroll").forEach((e, k) => { [e.scrollTop, e.scrollLeft] = sc[k] || [0, 0]; }); /* a redraw keeps each list where it was */
}
/* first from the copies kept on this iPad, so it opens at once, then from the newest files */
function fromKept() {
  const c = kept(CAL_FILE), t = kept(CUCU_FILE), y = kept(FATHER_FILE);
  if (c) cal = parseCalendar(c.text);
  if (t) cb.lines = t.text.split("\n");
  if (y) yo.lines = y.text.split("\n");
  const s = kept(SHOP_FILE); if (s) sh.lines = s.text.split("\n");
  keptWeather(); parseAll();
}
let loading = false;
async function loadAll() {
  if (!cfg().token) { setupMsg = ""; draw(); return; }
  if (loading || busy) return;
  loading = true;
  status("Updating…");
  const [c, t, y, s] = await Promise.allSettled([readFile(CAL_FILE), readFile(CUCU_FILE), readFile(FATHER_FILE), readFile(SHOP_FILE), loadWeather()]);
  loading = false;
  if (busy) return; /* a change made while loading is not drawn over */
  if (s.status === "fulfilled") sh.lines = s.value.text.split("\n");
  if (c.status === "fulfilled") cal = parseCalendar(c.value.text);
  if (t.status === "fulfilled") cb.lines = t.value.text.split("\n");
  if (y.status === "fulfilled") yo.lines = y.value.text.split("\n");
  parseAll();
  const bad = [c, t, y].find(x => x.status === "rejected");
  if (bad && /token/i.test(bad.reason.message)) { setupMsg = bad.reason.message; draw(); return; }
  const at = [c, t, y].map(x => x.value && x.value.at).find(Boolean);
  status(bad ? bad.reason.message : at ? `Offline. Showing what was loaded ${at}.` : "Synced " + stamp().split(", ").pop(), bad || at ? "err" : "ok");
  if (ts.edit === null && !(document.activeElement && document.activeElement.matches("[data-shq], #shIn"))) draw(); /* an open sheet or a field being typed in is not redrawn under the keyboard */
}

/* ---------- drag and drop on Tasks: a long press lifts a card or row; dropping it in another lane changes that property ---------- */
let dg = null, dragEnd = 0;
function dragStart(p) {
  const rc = p.el.getBoundingClientRect();
  p.on = true; p.dx = p.x - rc.left; p.dy = p.y - rc.top;
  try { if (p.el.hasPointerCapture(p.id)) p.el.releasePointerCapture(p.id); } catch (e) { /* nothing captured */ }
  p.ghost = p.el.cloneNode(true); p.ghost.classList.add("dghost"); p.ghost.classList.remove("sel");
  Object.assign(p.ghost.style, { width: rc.width + "px", height: rc.height + "px" });
  document.body.appendChild(p.ghost);
  p.ph = document.createElement("div"); p.ph.className = "dph"; p.ph.style.height = rc.height + "px";
  p.el.parentNode.insertBefore(p.ph, p.el); p.el.style.display = "none";
  p.home = dropAt(p);
  dragMove(p); requestAnimationFrame(dragScroll);
}
/* the lane and the visible rows either side of the dashed box */
function dropAt(p) {
  const near = dir => { let e = p.ph[dir]; while (e === p.el) e = e[dir]; return e && e.dataset && e.dataset.row ? cb.rows[+e.dataset.row] : null; };
  return { lane: p.ph.closest("[data-lane]").dataset.lane, before: near("nextElementSibling"), after: near("previousElementSibling") };
}
function dragMove(p) {
  p.ghost.style.transform = `translate(${p.x - p.dx}px,${p.y - p.dy}px) rotate(1.5deg)`;
  const hit = document.elementFromPoint(p.x, p.y), lane = hit && hit.closest("#main [data-lane]");
  if (!lane) return;
  const box = lane.querySelector(".lcl") || lane, items = [...box.children].filter(e => e.dataset.row && e !== p.el);
  const next = items.find(e => { const r = e.getBoundingClientRect(); return p.y < r.top + r.height / 2; });
  if (next) { if (p.ph.nextElementSibling !== next) box.insertBefore(p.ph, next); }
  else { const end = box.querySelector(":scope > .addc"); if (end) { if (p.ph.nextElementSibling !== end) box.insertBefore(p.ph, end); } else if (box.lastElementChild !== p.ph) box.appendChild(p.ph); }
}
/* near an edge, the list under the finger scrolls, and the board scrolls sideways */
function dragScroll() {
  const p = dg;
  if (!p || !p.on) return;
  let moved = false;
  const v = [...document.querySelectorAll("#main .lcl, #main .ll")].find(e => { const r = e.getBoundingClientRect(); return p.x >= r.left && p.x <= r.right; });
  if (v) { const r = v.getBoundingClientRect(), s = p.y < r.top + 56 ? -1 : p.y > r.bottom - 56 ? 1 : 0; if (s) { v.scrollTop += s * 12; moved = true; } }
  const h = document.querySelector("#main .lbd");
  if (h) { const r = h.getBoundingClientRect(), s = p.x < r.left + 60 ? -1 : p.x > r.right - 60 ? 1 : 0; if (s) { h.scrollLeft += s * 14; moved = true; } }
  if (moved) dragMove(p);
  requestAnimationFrame(dragScroll);
}
function dragStop(drop) {
  const p = dg;
  dg = null;
  if (!p) return;
  clearTimeout(p.timer);
  if (!p.on) return;
  dragEnd = Date.now();
  const to = dropAt(p);
  p.ghost.remove(); p.ph.remove(); p.el.style.display = "";
  const same = to.lane === p.home.lane && (to.before && to.before.n) === (p.home.before && p.home.before.n);
  if (!drop || same || (view.ord !== "Manual" && to.lane === p.home.lane)) { draw(); return; }
  const manual = view.ord === "Manual";
  cbMove(p.r, to.lane, manual ? to.before : null, manual && !to.before ? to.after : null);
}
document.addEventListener("pointerdown", ev => {
  if (tab !== "Tasks" || ts.edit !== null || ts.pop || dg || offline) return;
  const el = ev.target.closest(".lc[data-row], .lr[data-row]");
  if (!el || ev.target.closest("button")) return;
  const r = cb.rows[+el.dataset.row];
  if (!r) return;
  const p = dg = { el, r, id: ev.pointerId, x0: ev.clientX, y0: ev.clientY, x: ev.clientX, y: ev.clientY, on: false };
  p.timer = setTimeout(() => { if (dg === p) dragStart(p); }, ev.pointerType === "mouse" ? 150 : 300);
});
document.addEventListener("pointermove", ev => {
  const p = dg;
  if (!p || ev.pointerId !== p.id) return;
  p.x = ev.clientX; p.y = ev.clientY;
  if (!p.on) { if (Math.hypot(p.x - p.x0, p.y - p.y0) > 8) dragStop(false); return; }
  ev.preventDefault(); dragMove(p);
});
document.addEventListener("pointerup", ev => { if (dg && ev.pointerId === dg.id) dragStop(true); });
document.addEventListener("pointercancel", ev => { if (dg && ev.pointerId === dg.id) dragStop(dg.on); });
/* a catalog row follows the finger to the right; past 50px it stays open on Delete; held still for half a second, it opens the Edit item sheet */
let sw = null;
document.addEventListener("pointerdown", ev => {
  const el = tab === "Shopping" && !offline && !sh.edit && ev.target.closest("[data-shsw]");
  if (sw) clearTimeout(sw.timer);
  sw = el ? { el, id: ev.pointerId, x0: ev.clientX, y0: ev.clientY, dx: 0, open: sh.swiped === el.dataset.shsw } : null;
  if (sw) { const p = sw; p.timer = setTimeout(() => { if (sw !== p || p.on) return; sw = null; dragEnd = Date.now(); sh.swiped = null; sh.edit = { name: el.dataset.shsw, v: el.dataset.shsw }; draw(); }, 500); }
});
document.addEventListener("pointermove", ev => {
  const p = sw;
  if (!p || ev.pointerId !== p.id) return;
  p.dx = ev.clientX - p.x0;
  if (Math.hypot(p.dx, ev.clientY - p.y0) > 8) clearTimeout(p.timer);
  if (!p.on && Math.abs(p.dx) > 10 && Math.abs(p.dx) > Math.abs(ev.clientY - p.y0)) { p.on = true; p.el.style.transition = "none"; }
  if (p.on) p.el.style.transform = `translateX(${Math.max(0, Math.min(120, (p.open ? 96 : 0) + p.dx))}px)`;
});
document.addEventListener("pointerup", ev => {
  const p = sw;
  sw = null;
  if (p) clearTimeout(p.timer);
  if (!p || !p.on || ev.pointerId !== p.id) return;
  dragEnd = Date.now();
  sh.swiped = (p.open ? 96 : 0) + p.dx > 50 ? p.el.dataset.shsw : null;
  draw();
});
document.addEventListener("pointercancel", () => { if (sw) clearTimeout(sw.timer); if (sw && sw.on) draw(); sw = null; });
/* once a card is lifted, the finger moves it instead of scrolling */
document.addEventListener("touchmove", ev => { if (dg && dg.on) ev.preventDefault(); }, { passive: false });

document.addEventListener("click", ev => {
  if (Date.now() - dragEnd < 500) return;
  const at = q => ev.target.closest(q);
  let x;
  /* an open calendar tile closes on any tap outside it */
  if (cs.cwx && tab === "Calendar" && !at("[data-cwx]") && !at(".wxp") && !at("[data-calwx]")) { cs.cwx = null; if (!at("button")) { draw(); return; } }
  /* an open Add item field closes on any tap outside it */
  if (sh.adding !== null && !at("#shIn") && !at("[data-shadd]")) { sh.adding = null; if (!at("button")) { draw(); return; } }
  /* an open Delete closes on any other tap */
  if (sh.swiped !== null && !at("[data-shdel]")) { sh.swiped = null; draw(); return; }
  if (at("[data-popx]")) { ts.pop = null; draw(); }
  else if ((x = at("[data-shdel]"))) { const n = x.dataset.shdel; buzz(); sh.swiped = null; sh.edit = null; save(SHOP_FILE, lines => shDel(lines, n), `Tablet: deleted "${n}" from the shopping list`); }
  else if ((x = at("[data-shgot]"))) { const n = x.dataset.shgot, it = sh.d.items.find(i => i.name === n); if (it) save(SHOP_FILE, lines => shSet(lines, n, "Status", it.st === "Got" ? "On" : "Got"), `Tablet: ${it.st === "Got" ? "unchecked" : "got"} "${n}"`); }
  else if ((x = at("[data-shon]"))) { const n = x.dataset.shon, it = sh.d.items.find(i => i.name === n); if (it) save(SHOP_FILE, lines => shSet(lines, n, "Status", it.st ? "" : "On"), `Tablet: ${it.st ? "remove" : "add"} "${n}" ${it.st ? "from" : "to"} the shopping list`); }
  else if ((x = at("[data-shsec]"))) { sh.open[x.dataset.shsec] = !sh.open[x.dataset.shsec]; draw(); }
  else if ((x = at("[data-shadd]"))) { sh.adding = x.dataset.shadd; draw(); }
  else if (at("[data-calwx]")) { view.calwx = !view.calwx; cs.cwx = null; keepView(); draw(); }
  else if ((x = at("[data-cwx]"))) { cs.cwx = cs.cwx === x.dataset.cwx ? null : x.dataset.cwx; draw(); }
  else if ((x = at("[data-wk]"))) { cs.wk = Math.max(0, Math.min(3, +x.dataset.wk)); cs.cwx = null; draw(); }
  else if ((x = at("[data-wx]"))) { const k = x.dataset.wx; if (tab !== "Weather") { cs.wx = k; location.hash = "Weather"; } else { cs.wx = cs.wx === k ? null : k; draw(); } }
  else if ((x = at("[data-yoclr]"))) yoClear(x.dataset.yoclr);
  else if ((x = at("[data-pop]"))) { ts.pop = ts.pop === x.dataset.pop ? null : x.dataset.pop; draw(); }
  else if ((x = at("[data-fpick]"))) { const L = view.tf[x.dataset.fpick], v = x.dataset.v; L.includes(v) ? L.splice(L.indexOf(v), 1) : L.push(v); keepView(); draw(); }
  else if ((x = at("[data-fclr]"))) { view.tf[x.dataset.fclr] = []; keepView(); draw(); }
  else if (at("[data-shdone]")) { view.done = !view.done; keepView(); draw(); }
  else if ((x = at("[data-prop]"))) { view.props[x.dataset.prop] = !view.props[x.dataset.prop]; keepView(); draw(); }
  else if ((x = at("[data-seg]"))) { view[x.dataset.seg] = x.dataset.v; keepView(); draw(); }
  else if ((x = at("[data-fset]"))) { ts.f[x.dataset.fset] = x.dataset.v; draw(); }
  /* the Bug switch flips in place, so the keyboard stays up */
  else if ((x = at("[data-bug]"))) { ev.preventDefault(); ts.f.bug = !ts.f.bug; x.classList.toggle("on", ts.f.bug); x.setAttribute("aria-pressed", ts.f.bug); }
  else if (at("[data-shsave]")) shSave();
  else if (at("[data-close]")) { ts.edit = null; ts.r = null; sh.edit = null; draw(); }
  else if (at("[data-save]")) saveSheet();
  else if (at("[data-del]")) { const r = ts.r; ts.edit = null; ts.r = null; if (r) { buzz(); cbDel(r); } else draw(); }
  else if (at("[data-undo]")) cbUndo();
  else if ((x = at("[data-done]"))) { const n = +x.dataset.done; buzz(); x.innerHTML = sGlyph("Done", +x.querySelector("svg").getAttribute("width")); const row = x.closest("[data-row]"); if (row) row.classList.add("gone"); setTimeout(() => cbTick(n), 320); }
  else if ((x = at("[data-yo]"))) { buzz(); yoTick(+x.dataset.yo); }
  else if ((x = at("[data-add]"))) openSheet(null, x.dataset.add);
  else if ((x = at("[data-edit]"))) { const r = cb.rows[+x.dataset.edit]; if (r) openSheet(r); }
  else if ((x = at("[data-go]")) && !setupMsg) { if (x.dataset.go === tab && tab === "Home") loadAll(); location.hash = x.dataset.go; }
});
document.addEventListener("submit", ev => {
  ev.preventDefault();
  if (ev.target.id !== "setup") return;
  store.set("token", $("token").value.trim()); setupMsg = null; draw(); loadAll();
});
addEventListener("hashchange", () => { tab = NAV.includes(location.hash.slice(1)) ? location.hash.slice(1) : "Home"; ts.edit = ts.r = ts.pop = cs.cwx = null; draw(); });
/* Return in the sheet saves it */
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.closest && ev.target.closest(".bs")) { ev.preventDefault(); if (sh.edit) shSave(); else saveSheet(); } });
/* Shopping: Return in an Add item field adds the item to its subcategory and the list; Return in a Qty field saves it */
document.addEventListener("keydown", ev => {
  const t = ev.target;
  if (t.id === "shIn" && ev.key === "Escape") { sh.adding = null; draw(); }
  else if (t.id === "shIn" && ev.key === "Enter") { ev.preventDefault(); const n = cbEnc(t.value), k = sh.adding; sh.adding = null; if (n) save(SHOP_FILE, lines => shAdd(lines, n, k), `Tablet: add "${n}" to the shopping list`); else draw(); }
  else if (t.dataset && t.dataset.shq !== undefined && ev.key === "Enter") { ev.preventDefault(); t.blur(); }
});
document.addEventListener("change", ev => {
  const n = ev.target.dataset && ev.target.dataset.shq, it = n && sh.d.items.find(i => i.name === n);
  const v = ev.target.value;
  if (it && cbEnc(v) !== it.q) save(SHOP_FILE, lines => shSet(lines, n, "Qty", v), `Tablet: "${n}" quantity`);
});
/* the iPad sits on its dock: the files are read again every five minutes and whenever the app comes back to the front */
setInterval(() => { if (!document.hidden) loadAll(); }, 5 * 60e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadAll(); });

fromKept(); draw(); loadAll();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
