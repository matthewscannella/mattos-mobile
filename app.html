<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1218">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MattOS">
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="apple-touch-icon" href="icon-180-v5.png">
<link rel="icon" type="image/png" href="icon-192-v5.png">
<title>MattOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Nova dark palette, as in mattOs.html */
  :root { --side: #0f1218; --body: #0a0c11; --tx: #e7e9ee; --hi: #fff; --mut: #8b93a3; --line: #1c202a; --rule: #232733; --card: #13161d; --raised: #1b202b; --acc: #8dabf9; --blue: #3b6ef5; --done: #3fcf8e; --flag: #f97066; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: var(--body); color: var(--tx); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 22px; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; --cut: var(--body); }
  button { all: unset; box-sizing: border-box; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 4px; }
  .ic { flex: none; display: block; }
  .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .grow { flex: 1; min-width: 0; }

  /* ---------- header and bottom bar, the same on every tab: no search field, and the add button floats over the screen ---------- */
  .hd { flex: none; background: var(--side); color: #fff; padding: calc(env(safe-area-inset-top) + 10px) 16px 12px; border-bottom: 1px solid var(--line); }
  .ws { display: flex; align-items: center; gap: 10px; }
  .logo { width: 32px; height: 32px; border-radius: 8px; background: var(--blue); display: grid; place-items: center; font-size: 17px; }
  .ws b { font-size: 19px; font-weight: 600; flex: 1; letter-spacing: -.01em; }
  .av { width: 32px; height: 32px; border-radius: 8px; background: #e8b88f; color: #4a2a12; display: grid; place-items: center; font-size: 12px; font-weight: 700; position: relative; }
  .av::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--done); border: 2px solid var(--side); }
  .av.off::after { background: var(--mut); }
  .scr { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 0 16px 84px; -webkit-overflow-scrolling: touch; }
  .scr::-webkit-scrollbar { display: none; }
  .tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 6px calc(env(safe-area-inset-bottom) + 8px); border-top: 1px solid var(--line); background: var(--side); }
  .tab { display: grid; justify-items: center; }
  .tab .w { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; color: var(--mut); --cut: var(--side); }
  .tab.on .w { background: var(--blue); color: #fff; --cut: var(--blue); }
  .fab { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 78px); width: 54px; height: 54px; border-radius: 16px; background: var(--blue); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0, 0, 0, .5); z-index: 3; }
  .fab:active { filter: brightness(.9); }

  /* ---------- shared text, cards and buttons ---------- */
  .status { font-size: 12.5px; line-height: 16px; color: var(--mut); padding: 8px 2px 0; }
  .status:empty { display: none; }
  .status.err { color: var(--flag); }
  .status.ok { color: var(--done); }
  .big { padding: 14px 2px 10px; font-size: 22px; line-height: 28px; font-weight: 700; color: #fff; letter-spacing: -.01em; }
  .s { font-size: 13px; line-height: 18px; color: var(--mut); }
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 14px; --cut: var(--card); }
  .btn { border: 1px solid var(--rule); border-radius: 10px; padding: 7px 12px; font-size: 14px; color: var(--mut); white-space: nowrap; }
  .btn:active { background: var(--raised); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; text-align: center; padding: 11px 12px; }
  .btn.danger { color: var(--flag); }
  .empty { text-align: center; color: var(--mut); padding: 56px 16px; }

  /* ---------- Notes ---------- */
  .note { display: grid; gap: 1px; width: 100%; margin-bottom: 6px; padding: 10px 12px; border-radius: 12px; background: var(--card); }
  .note:active { background: var(--raised); }
  .note b { font-size: 15px; line-height: 21px; font-weight: 600; color: var(--tx); }
  .editor { display: grid; gap: 10px; padding-top: 10px; }
  .editor .top { display: flex; justify-content: space-between; align-items: center; }
  .editor input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; padding: 4px 0 10px; font-size: 22px; line-height: 28px; font-weight: 700; color: #fff; outline: none; }
  .editor input:focus { border-bottom-color: var(--blue); }
  .editor textarea { width: 100%; min-height: 50vh; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 12px; resize: vertical; outline: none; }
  .editor textarea:focus { border-color: var(--blue); }

  /* ---------- Calendar ---------- */
  /* Today and Next Up are two screens, switched at the top */
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; margin-top: 12px; padding: 4px; border-radius: 12px; background: var(--card); border: 1px solid var(--rule); }
  .seg button { text-align: center; padding: 7px 0; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--mut); }
  .seg button.on { background: var(--blue); color: #fff; }
  .tag { display: inline-block; height: 18px; line-height: 18px; padding: 0 7px; border-radius: 9px; font-size: 11px; font-weight: 600; vertical-align: 1px; white-space: nowrap; }
  .tag.live { background: rgba(63, 207, 142, .16); color: var(--done); }
  .tag.old { background: rgba(249, 112, 102, .16); color: var(--flag); }
  .h2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 20px 2px 8px; font-size: 13.5px; font-weight: 600; color: var(--tx); }
  .h2 span { font-weight: 400; font-size: 12.5px; color: var(--mut); }
  .ev { display: flex; gap: 11px; align-items: stretch; }
  .ev > i { flex: none; width: 4px; border-radius: 2px; background: var(--blue); }
  .ev b { display: block; font-size: 18px; line-height: 24px; font-weight: 600; color: #fff; }
  .ev span { display: block; font-size: 13.5px; line-height: 18px; color: var(--mut); }
  .ev + .ev { margin-top: 9px; }
  .wxl { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .wxl:first-child { margin-top: 0; }
  .wxl .v { font-size: 36px; line-height: 40px; font-weight: 700; letter-spacing: -.02em; color: #fff; }
  .wxl .t1 { font-weight: 600; color: #fff; display: flex; align-items: center; gap: 7px; }
  .srcl { display: flex; align-items: center; gap: 7px; padding: 12px 2px 0; font-size: 12px; line-height: 16px; color: var(--mut); }
  /* the next 24 hours, six to a screen, scrolling sideways to the screen's edges; a blue dot marks an outdoor score above 85 */
  .wk { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 20px) / 6); gap: 4px; margin: 0 -16px; padding: 12px 16px 0; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; scroll-padding: 0 16px; }
  .wk::-webkit-scrollbar { display: none; }
  .wc { display: grid; justify-items: center; gap: 5px; padding: 11px 0 9px; border-radius: 14px; font-size: 13px; line-height: 16px; color: var(--mut); --cut: var(--body); scroll-snap-align: start; }
  .wc b { font-size: 20px; line-height: 24px; color: var(--tx); font-weight: 700; }
  .wc svg { color: var(--tx); margin-top: 2px; }
  .dot { display: block; width: 5px; height: 5px; margin-top: 2px; border-radius: 50%; background: var(--blue); }
  .dot.no { background: transparent; }
  .wc.on { background: var(--blue); color: rgba(255, 255, 255, .85); --cut: var(--blue); }
  .wc.on b, .wc.on svg { color: #fff; }
  .wc.on .dot { background: #fff; }
  .wc.on .dot.no { background: transparent; }
  .key { display: flex; align-items: center; gap: 6px; padding: 6px 2px 0; }
  .key .dot { margin: 0; }
  .bks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .bk { display: grid; gap: 3px; align-content: start; padding: 10px; border-radius: 14px; background: var(--card); border: 1px solid var(--rule); --cut: var(--card); min-height: 126px; }
  .bk > b { font-size: 14px; color: #fff; font-weight: 600; }
  .bk .bl { font-size: 12px; line-height: 15px; font-weight: 600; color: var(--mut); }
  .bk .sc { margin-top: 4px; font-size: 22px; line-height: 26px; font-weight: 700; color: var(--tx); }
  .bk .sc small { display: block; font-size: 11px; line-height: 13px; font-weight: 500; color: var(--mut); }
  .bk.good { border-color: rgba(63, 207, 142, .5); background: #12241f; --cut: #12241f; }
  .bk.good .sc { color: var(--done); }
  .up { display: flex; align-items: center; gap: 12px; padding: 7px 2px; }
  .up .dt { flex: none; width: 50px; display: grid; font-size: 12px; line-height: 15px; color: var(--mut); }
  .up .dt b { font-size: 14px; line-height: 18px; color: var(--tx); font-weight: 600; }
  .up .t { font-weight: 600; color: var(--tx); }
  .up .meta { font-size: 13px; color: var(--mut); white-space: nowrap; }
  /* next 7 days: one pill per day, with morning, afternoon and evening filled by the outdoor score */
  .hps { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .hp { display: grid; gap: 3px; justify-items: center; min-width: 0; font-size: 12.5px; line-height: 16px; color: var(--mut); }
  .hp > b { font-weight: 600; color: var(--tx); }
  .hp.td > b { color: var(--acc); }
  .hp svg { color: var(--tx); }
  .hpp { width: 100%; display: grid; gap: 2px; border-radius: 8px; }
  .hpp i { height: 24px; background: color-mix(in srgb, var(--done) var(--a, 0%), var(--raised)); }
  .hpp i:first-child { border-radius: 8px 8px 0 0; }
  .hpp i:last-child { border-radius: 0 0 8px 8px; }
  .hpp i.gone { background: none; border: 1px dashed var(--rule); }
  .hp.on .hpp { outline: 2px solid var(--blue); outline-offset: 2px; }
  .pdet { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--rule); }
  .pdet b { color: var(--tx); font-weight: 600; }
  .pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .pill { height: 22px; line-height: 22px; padding: 0 8px; border-radius: 11px; background: var(--raised); font-size: 11.5px; font-weight: 600; color: var(--tx); white-space: nowrap; }
  .pill.good { background: rgba(63, 207, 142, .16); color: var(--done); }

  /* ---------- Settings ---------- */
  .setup { display: grid; gap: 14px; }
  .setup label { display: grid; gap: 5px; font-size: 13px; color: var(--mut); }
  .setup input { width: 100%; background: var(--body); border: 1px solid var(--rule); border-radius: 10px; padding: 10px; font-size: 16px; color: var(--tx); outline: none; }
  .setup input:focus { border-color: var(--blue); }
  .setup p { margin: 0; font-size: 14px; color: var(--mut); }

  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 78px); display: flex; align-items: center; gap: 12px; background: var(--raised); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px 10px 16px; box-shadow: 0 6px 20px rgba(0, 0, 0, .4); z-index: 4; }
  .toast span { flex: 1; }
</style>
</head>
<body>
<header class="hd"><div class="ws"><span class="logo" aria-hidden="true">✳</span><b>MattOS</b><button class="av" type="button" id="settings" aria-label="Settings">MS</button></div></header>
<main class="scr" id="scr"><div class="status" id="status" role="status"></div><div id="main"></div></main>
<button class="fab" type="button" id="fab" aria-label="Add" hidden></button>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast" hidden><span id="toastmsg"></span><button class="btn" type="button" id="undo">Undo</button></div>
<script>
/* MattOS for the phone. Reads and writes the registry files in the private mattos-data repository through the GitHub API.
   The format functions match the desktop app's exactly, so both sides read each other's edits. */

/* solid style only: filled shapes, details cut out in the background colour, or heavy strokes */
const F = 'fill="currentColor" stroke="none"', C = 'fill="none" stroke="var(--cut)" stroke-width="2"';
const FS = 'fill="currentColor" stroke="currentColor" stroke-width="1.5"', CF = 'fill="var(--cut)" stroke="none"';
const K = w => `fill="none" stroke="currentColor" stroke-width="${w}"`;
const svg = (inner, s = 24, w = 2, cls = "") => `<svg class="ic${cls ? " " + cls : ""}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const TAB = {
  Home: `<path ${FS} d="M12 3 2.5 11h2.5v9.5h14V11h2.5z"/><rect ${CF} x="10" y="14" width="4" height="7.5" rx="1"/>`,
  Calendar: `<rect ${F} x="2.5" y="3.5" width="19" height="18" rx="3"/><path ${C} d="M2.5 9.5h19"/><path fill="none" stroke="var(--cut)" stroke-width="2.6" d="M7.5 13.5h.01M12 13.5h.01M16.5 13.5h.01M7.5 17.5h.01M12 17.5h.01"/>`,
  Habits: `<path ${F} d="M3.2 20.8C4.5 15.5 8 10.5 12.3 8.3a3.3 3.3 0 0 1 4.4 4.4C14.5 17 9.5 20.5 4.2 21.8a.8.8 0 0 1-1-1z"/><path ${K(2.6)} d="M15.5 9.5 16.5 3.5M15.5 9.5l5-5M15.5 9.5l6-1"/>`,
  Tasks: `<rect ${F} x="4" y="4" width="16" height="18" rx="3"/><rect fill="currentColor" stroke="var(--cut)" stroke-width="1.8" x="8.5" y="1.8" width="7" height="5" rx="1.8"/><path ${C} d="m8.5 14.3 2.4 2.4 4.6-5"/>`,
  Notes: `<path ${FS} d="M4 4h16v10.5L14.5 20H4z"/><path ${C} d="M20.5 14h-6.5v6.5"/>`
};
const UI = { plus: `<path d="M12 5v14M5 12h14"/>` };

const $ = id => document.getElementById(id);
const esc = s => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const stamp = () => { const d = new Date(), h = d.getHours(), m = d.getMinutes(); return `${d.toLocaleString("en-US", { month: "short" })} ${d.getDate()}, ${d.getFullYear()}, ${h % 12 || 12}${m ? ":" + String(m).padStart(2, "0") : ""}${h < 12 ? "am" : "pm"}`; };
function status(msg, kind = "") { $("status").textContent = msg; $("status").className = "status" + (kind ? " " + kind : ""); }

/* settings live in this browser only */
const store = {
  get: k => { try { return localStorage.getItem("mattos-" + k) || ""; } catch (e) { return ""; } },
  set: (k, v) => { try { localStorage.setItem("mattos-" + k, v); } catch (e) { /* private mode: lasts until the tab closes */ } }
};
const cfg = () => ({ owner: store.get("owner") || "matthewscannella", repo: store.get("repo") || "mattos-data", token: store.get("token") });

/* GitHub contents API. Every function takes the file's path in the repository */
const b64decode = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));
const b64encode = text => { const bytes = new TextEncoder().encode(text); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(bin); };
const apiUrl = path => { const c = cfg(); return `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}`; };
const headers = () => ({ Authorization: `Bearer ${cfg().token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" });
const keep = (path, text) => store.set("file-" + path, JSON.stringify({ text, at: stamp() }));
async function fetchFile(path) {
  const r = await fetch(apiUrl(path) + "?ref=main&t=" + Date.now(), { headers: headers(), cache: "no-store" });
  if (r.status === 401) throw new Error("The token was rejected. Open Settings and paste a new one.");
  if (r.status === 404) throw new Error(`${path.split("/").pop()} was not found. Check the repository name in Settings, and that the laptop has synced once.`);
  if (!r.ok) throw new Error(`GitHub returned ${r.status}.`);
  const j = await r.json(), text = b64decode(j.content);
  keep(path, text);
  return { text, sha: j.sha };
}
async function putFile(path, text, sha, message) {
  const r = await fetch(apiUrl(path), { method: "PUT", headers: { ...headers(), "Content-Type": "application/json" }, body: JSON.stringify({ message, content: b64encode(text), sha, branch: "main" }) });
  if (r.status === 409 || r.status === 422) return null; /* someone else saved first: caller retries on the newer file */
  if (!r.ok) throw new Error(r.status === 403 ? "The token can't write to this repository. Give it Contents: Read and write." : `Save failed: GitHub returned ${r.status}.`);
  keep(path, text);
  return (await r.json()).content.sha;
}
/* for showing a screen: the newest file, or the copy kept from the last load when there is no connection. Nothing is edited from a kept copy */
let offline = false;
async function readFile(path) {
  try { const f = await fetchFile(path); setOffline(false); return f; }
  catch (e) {
    if (!(e instanceof TypeError)) throw e;
    let kept = null; try { kept = JSON.parse(store.get("file-" + path)); } catch (x) { /* nothing kept */ }
    if (!kept) throw new Error("No connection, and nothing has been loaded on this phone yet.");
    setOffline(true);
    return { text: kept.text, sha: null, at: kept.at };
  }
}
function setOffline(v) { offline = v; $("settings").classList.toggle("off", v); }
/* every save starts from the newest file on GitHub and changes only its own part, so laptop edits to the rest are kept.
   change(list) edits the parsed list in place and returns the item it touched */
let saving = Promise.resolve();
function commitFile(path, parse, serialize, change, message, onSaved) {
  saving = saving.then(async () => {
    status("Saving…");
    for (let attempt = 0; attempt < 4; attempt++) {
      const latest = await fetchFile(path);
      const list = parse(latest.text);
      const item = change(list);
      const text = serialize(list);
      if (text === latest.text) { if (onSaved) onSaved(item, list); status("Saved", "ok"); return item; }
      const newSha = await putFile(path, text, latest.sha, message);
      if (newSha) { if (onSaved) onSaved(item, list); status("Saved " + stamp().split(", ").pop(), "ok"); return item; }
    }
    throw new Error("Could not save after several tries. Check your connection, then tap the tab again.");
  }).catch(e => { status(e instanceof TypeError ? "No connection. This change was not saved." : e.message, "err"); });
  return saving;
}

/* ---------- Notes ---------- */
const NOTES_FILE = "03🗒️-notes/notesRegistry.md";
const NOTE_HEAD = `# Notes Registry\n\nSource of truth for MattOS notes. Newest first.\n`;
const serializeNotes = notes => NOTE_HEAD + notes.map(n => `\n---\n\n<!-- note: ${n.id} -->\n## ${n.title || ""}\n_Edited ${n.edited}_\n\n${n.body}\n`).join("");
function parseNotes(md) {
  const parts = md.split(/^<!-- note: (.+?) -->[ \t]*\r?$/m), out = [];
  for (let i = 1; i < parts.length; i += 2) {
    const lines = parts[i + 1].replace(/^\r?\n/, "").split(/\r?\n/);
    const tm = (lines[0] || "").match(/^##\s?(.*)$/);
    let k = tm ? 1 : 0;
    const em = (lines[k] || "").match(/^_Edited (.*)_$/);
    if (em) k++;
    if (lines[k] === "") k++;
    out.push({ id: parts[i].trim(), title: tm ? tm[1].trim() : "", edited: em ? em[1] : "", body: lines.slice(k).join("\n").replace(/\s*(\n---\s*)?$/, "") });
  }
  return out;
}
let notes = [], openId = null, base = null, saveTimer = null, undoNote = null, toastTimer = null;
const commitNotes = (change, message, onSaved) => commitFile(NOTES_FILE, parseNotes, serializeNotes, change, message, (item, list) => { notes = list; if (onSaved) onSaved(item); });
const seen = {};
/* the file drops spaces and blank lines at the end of a title or body, so notes are compared the way the file stores them.
   Otherwise a save that lands just after a typed space looks like a laptop edit on the next save */
const filed = n => ({ title: (n.title || "").trim(), body: (n.body || "").replace(/\s*(\n---\s*)?$/, "") });
const differs = (a, b) => { a = filed(a); b = filed(b); return a.title !== b.title || a.body !== b.body; };
const dirty = () => openId && base && $("ntitle") && ($("ntitle").value !== base.title || $("nbody").value !== base.body);
/* If the same note changed on the laptop since it was opened here, the phone's version is saved as a separate copy */
function upsertOpenNote() {
  if (!openId) return;
  const title = $("ntitle").value, body = $("nbody").value, id = openId;
  let clash = false;
  commitNotes(list => {
    const i = list.findIndex(n => n.id === id), cur = list[i], start = seen[id];
    const mine = { id, title, body, edited: stamp() };
    clash = !!(cur && start && differs(cur, start) && differs(cur, mine));
    if (clash) {
      const copy = { ...mine, id: "n" + Date.now().toString(36), title: (title || "Untitled") + " (phone copy)" };
      list.unshift(copy);
      return copy;
    }
    if (cur) Object.assign(cur, mine); else list.unshift(mine);
    return mine;
  }, `Phone: edit "${title || "Untitled"}"`, saved => {
    seen[saved.id] = { title: saved.title, body: saved.body };
    if (openId === id) base = { title, body };
    if (clash && openId === id) {
      openId = saved.id; base = { title: saved.title, body };
      if ($("ntitle")) $("ntitle").value = saved.title;
      setTimeout(() => status("This note changed on the laptop too, so your version was saved as a copy.", "err"), 0);
    }
  });
}
function showNoteList() {
  openId = null; base = null; $("fab").hidden = offline;
  $("main").innerHTML = `<div class="big">Notes</div>` + (notes.length
    ? notes.map(n => `<button class="note" type="button" data-id="${esc(n.id)}"><b class="ell">${esc(n.title) || "Untitled"}</b><span class="s ell num">${esc(n.edited)}</span><span class="s ell">${esc(n.body.split("\n").find(l => l.trim())) || "Empty note"}</span></button>`).join("")
    : `<div class="empty">No notes yet. Tap the add button to start one.</div>`);
}
function showNote(id) {
  const n = notes.find(x => x.id === id);
  if (!n) return showNoteList();
  openId = id; base = { title: n.title, body: n.body }; seen[id] = { title: n.title, body: n.body };
  $("fab").hidden = true;
  const ro = offline ? " readonly" : "";
  $("main").innerHTML = `<div class="editor">
    <div class="top"><button class="btn" type="button" id="back">‹ Notes</button>${offline ? "" : `<button class="btn danger" type="button" id="del">Delete</button>`}</div>
    <input id="ntitle" placeholder="Untitled" value="${esc(n.title)}" autocomplete="off" aria-label="Title"${ro}>
    <span class="s num">Edited ${esc(n.edited)}</span>
    <textarea id="nbody" placeholder="Start writing…" aria-label="Note"${ro}>${esc(n.body)}</textarea></div>`;
}
async function loadNotes() {
  const f = await readFile(NOTES_FILE);
  notes = parseNotes(f.text);
  status(f.at ? `Offline. Showing notes loaded ${f.at}; changes are off until you reconnect.` : "Synced " + stamp().split(", ").pop(), f.at ? "err" : "ok");
  showNoteList();
}
function newNote() {
  const note = { id: "n" + Date.now().toString(36), title: "", edited: stamp(), body: "" };
  notes.unshift(note); showNote(note.id); $("ntitle").focus();
  commitNotes(list => { list.unshift({ ...note }); return note; }, "Phone: new note", () => { seen[note.id] = { title: "", body: "" }; });
}
/* called before the screen changes: an open note with unsaved typing is saved first */
function leaveNotes() { clearTimeout(saveTimer); if (dirty()) upsertOpenNote(); openId = null; base = null; }

/* ---------- dates ---------- */
const p2 = n => String(n).padStart(2, "0");
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const isoDay = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const atNoon = s => new Date(s + "T12:00");
const today = () => isoDay(new Date());
const addDays = (s, n) => { const d = atNoon(s); d.setDate(d.getDate() + n); return isoDay(d); };
const fmtDay = (s, o) => atNoon(s).toLocaleDateString("en-US", o);
const wkDay = s => fmtDay(s, { weekday: "short" }), monDay = s => fmtDay(s, { month: "short", day: "numeric" }), fullDay = s => fmtDay(s, { weekday: "long", month: "short", day: "numeric" });
const relDay = s => { const n = Math.round((atNoon(s) - atNoon(today())) / 864e5); return n === 0 ? "Today" : n === 1 ? "Tomorrow" : `In ${n} days`; };
const hr12 = h => `${h % 12 || 12} ${h < 12 ? "AM" : "PM"}`;

/* ---------- weather: the desktop app's Open-Meteo call for Hoboken, its outdoor score and its day blocks (PCAL_BLOCKS, wxScore, pcalWxFill) ---------- */
const WX_URL = "https://api.open-meteo.com/v1/forecast?latitude=40.744&longitude=-74.0324&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,apparent_temperature,weather_code,precipitation_probability,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FNew_York&forecast_days=16";
const WX_LABEL = { 0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Cloudy", 45: "Fog", 48: "Fog", 51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle", 61: "Light rain", 63: "Rain", 65: "Heavy rain", 66: "Freezing rain", 67: "Freezing rain", 71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains", 80: "Showers", 81: "Showers", 82: "Heavy showers", 85: "Snow showers", 86: "Snow showers", 95: "Thunderstorm", 96: "Thunderstorm, hail", 99: "Thunderstorm, hail" };
const cloudD = "M17.5 19a4.5 4.5 0 0 0 .5-8.97A6 6 0 0 0 6.3 11.5 3.8 3.8 0 0 0 7 19z";
const WXI = {
  sun: `<circle ${F} cx="12" cy="12" r="5"/><path ${K(2.6)} d="M12 2v1.5M12 20.5V22M4.9 4.9 6 6M18 18l1.1 1.1M2 12h1.5M20.5 12H22M4.9 19.1 6 18M18 6l1.1-1.1"/>`,
  part: `<circle ${F} cx="8.5" cy="7.5" r="4.8"/><path fill="currentColor" stroke="var(--cut)" stroke-width="2" d="M17.5 21.5a4.5 4.5 0 0 0 .5-8.97A6 6 0 0 0 6.5 14 3.8 3.8 0 0 0 7 21.5z"/>`,
  cloud: `<path ${F} d="${cloudD}"/>`,
  rain: `<path ${F} transform="translate(0 -3.5)" d="${cloudD}"/><path ${K(2.4)} d="M8 19.5v2M12 19.5v2M16 19.5v2"/>`,
  snow: `<path ${F} transform="translate(0 -3.5)" d="${cloudD}"/><path ${K(2.8)} d="M8 20.5h.01M12 20.5h.01M16 20.5h.01"/>`,
  moon: `<path ${F} d="M20.5 14.2A8.6 8.6 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7z"/>`
};
const wxIco = (n, s) => svg(WXI[n], s);
const wxIcon = c => c === 0 ? "sun" : c <= 2 ? "part" : c <= 48 ? "cloud" : (c >= 71 && c <= 77) || c === 85 || c === 86 ? "snow" : "rain";
const wxLabel = c => WX_LABEL[c] || "Weather";
const WX_BLOCKS = [{ label: "Morning", from: 8, to: 12 }, { label: "Afternoon", from: 12, to: 16 }, { label: "Evening", from: 16, to: 20 }];
const wxScore = (feel, p, code) => Math.round(100
  * (feel >= 66 && feel <= 76 ? 1 : feel < 66 ? Math.max(0, (feel - 40) / 26) : Math.max(0, (95 - feel) / 19))
  * (p <= 50 ? 1 - p / 100 : Math.max(0, .5 * (80 - p) / 30))
  * (code <= 2 ? 1 : code === 3 ? .8 : code <= 48 ? .6 : code <= 55 ? .3 : 0));
const wxFill = s => s < 65 ? 0 : .22 + .78 * Math.pow((s - 65) / 35, 1.4);
/* W is the newest forecast, or the one kept from the last load when there is no connection. It is dropped once it no longer covers today */
let W = null, wxLive = false, wxRead = "";
async function loadWeather() {
  const covers = j => j && j.current && j.hourly && j.daily && j.daily.time.includes(today());
  try {
    const j = await (await fetch(WX_URL, { cache: "no-store" })).json();
    if (!covers(j)) throw new Error("no forecast");
    W = j; wxLive = true; wxRead = stamp().split(", ").pop();
    store.set("weather", JSON.stringify({ j, at: stamp() }));
  } catch (e) {
    let kept = null; try { kept = JSON.parse(store.get("weather")); } catch (x) { /* nothing kept */ }
    wxLive = false; W = kept && covers(kept.j) ? kept.j : null; wxRead = kept ? kept.at : "";
  }
}
const wxNowKey = () => `${today()}T${p2(new Date().getHours())}`;
const wxDay = s => { const d = W.daily, i = d.time.indexOf(s); return i < 0 || d.temperature_2m_max[i] == null ? null : { code: d.weather_code[i], hi: Math.round(d.temperature_2m_max[i]), lo: Math.round(d.temperature_2m_min[i]), p: d.precipitation_probability_max[i] ?? 0 }; };
function wxHoursAt(i0, n) {
  const h = W.hourly, out = [];
  if (i0 < 0) return out;
  for (let i = i0; i < i0 + n && i < h.time.length; i++) {
    if (h.temperature_2m[i] == null || h.weather_code[i] == null) continue;
    const p = h.precipitation_probability[i] ?? 0, feel = h.apparent_temperature[i] ?? h.temperature_2m[i];
    out.push({ h: +h.time[i].slice(11, 13), temp: Math.round(h.temperature_2m[i]), feel: Math.round(feel), p, code: h.weather_code[i], day: h.is_day[i] === 1, past: h.time[i].slice(0, 13) < wxNowKey(), score: wxScore(feel, p, h.weather_code[i]) });
  }
  return out;
}
const wxHours = (s, from, to) => wxHoursAt(W.hourly.time.indexOf(`${s}T${p2(from)}:00`), to - from);
const wxFromNow = n => wxHoursAt(W.hourly.time.indexOf(wxNowKey() + ":00"), n);
/* the commonest sky over the daylight hours given, or over all of them when none are in daylight */
function wxCommon(hs) { const lit = hs.filter(x => x.day), count = {}; (lit.length ? lit : hs).forEach(x => { count[x.code] = (count[x.code] || 0) + 1; }); return +Object.keys(count).sort((a, b) => count[b] - count[a])[0]; }
/* one block of one day: null when the forecast does not reach it or the block is over */
function wxBlock(s, b) {
  const hs = wxHours(s, b.from, b.to).filter(x => !x.past);
  if (!hs.length) return null;
  return { score: Math.round(hs.reduce((a, x) => a + x.score, 0) / hs.length), lo: Math.min(...hs.map(x => x.temp)), hi: Math.max(...hs.map(x => x.temp)), p: Math.max(...hs.map(x => x.p)), code: wxCommon(hs) };
}
const wxHourIcon = x => !x.day && x.code <= 2 ? "moon" : wxIcon(x.code);
const wxGood = s => s >= 65 ? " good" : "";
const wxTag = () => wxLive ? '<span class="tag live">Live</span>' : '<span class="tag old">Kept</span>';

/* ---------- Calendar: read only. The registry is rewritten by the laptop and by a GitHub job every 30 minutes ---------- */
const CAL_FILE = "10📅-calendar/calendarRegistry.md";
/* rows are | Mon Oct 12 | 11:30 AM | 11:45 AM | Title | Location | Attendees |, with no start for an all-day event.
   The rows carry no year: it is taken from the Synced line, and a month earlier than that line's falls in the next year */
function parseCalendar(md) {
  const synced = ((md.match(/^\*\*Synced:\*\*\s*(.+?)\s*$/m) || [])[1] || "");
  const sm = synced.match(/([A-Z][a-z]{2}) \d{1,2}, (\d{4})/), now = new Date();
  const m0 = sm ? MONTHS.indexOf(sm[1]) : now.getMonth(), y0 = sm ? +sm[2] : now.getFullYear();
  const events = [];
  (md.split(/^## Events\s*$/m)[1] || "").split(/\r?\n/).forEach(line => {
    const c = line.split("|").slice(1, -1).map(x => x.trim()), dm = (c[0] || "").match(/^[A-Z][a-z]{2} ([A-Z][a-z]{2}) (\d{1,2})$/);
    if (!dm || !c[3]) return;
    const m = MONTHS.indexOf(dm[1]);
    events.push({ d: `${y0 + (m < m0 ? 1 : 0)}-${p2(m + 1)}-${p2(+dm[2])}`, start: c[1], end: c[2], title: c[3] });
  });
  return { synced: synced.replace(/, \d{4}/, ""), events };
}
let cal = { synced: "", events: [] }, calPick = null, calView = "Today";
const calWhen = e => e.start ? (e.end ? `${e.start} to ${e.end}` : e.start) : "All day";
function calWeather() {
  const td = today(), d = wxDay(td), now = wxLive ? { code: W.current.weather_code, temp: Math.round(W.current.temperature_2m), feel: Math.round(W.current.apparent_temperature) } : wxFromNow(1)[0];
  const head = now ? `<div class="wxl">${wxIco(wxIcon(now.code), 36)}<span class="v num">${now.temp}°</span><div class="grow"><div class="t1"><span class="ell">${wxLabel(now.code)}</span>${wxTag()}</div><div class="s num">H ${d.hi}° L ${d.lo}°, feels ${now.feel}°</div></div></div>` : "";
  const strip = `<div class="wk" id="wk">${wxFromNow(24).map((x, k) => `<div class="wc${k ? "" : " on"}"${x.score > 85 ? ` aria-label="Outdoor score ${x.score}"` : ""}><span class="num">${k ? hr12(x.h) : "Now"}</span><b class="num">${x.temp}°</b>${wxIco(wxHourIcon(x), 24)}<span class="num">${x.p}%</span><i class="dot${x.score > 85 ? "" : " no"}"></i></div>`).join("")}</div>
    <div class="s key"><i class="dot"></i>Outdoor score above 85</div>`;
  const tiles = WX_BLOCKS.map(b => { const B = wxBlock(td, b); return B ? `<div class="bk${wxGood(B.score)}"><span class="bl">${b.label}</span>${wxIco(wxIcon(B.code), 22)}<b class="num">${B.lo === B.hi ? `${B.lo}°` : `${B.lo} to ${B.hi}°`}</b><span class="s num">Rain ${B.p}%</span><span class="sc num">${B.score}<small>Outdoor score</small></span></div>` : `<div class="bk"><span class="bl">${b.label}</span><span class="s">Already past</span></div>`; }).join("");
  const days = Array.from({ length: 7 }, (_, i) => addDays(td, i)).filter(wxDay);
  if (calPick && !days.includes(calPick)) calPick = null;
  const pills = days.map(x => {
    const hs = wxHours(x, 8, 20).filter(h => !h.past), code = hs.length ? wxCommon(hs) : wxDay(x).code;
    const segs = WX_BLOCKS.map(b => { const B = wxBlock(x, b); return B ? `<i style="--a:${Math.round(wxFill(B.score) * 95)}%"></i>` : '<i class="gone"></i>'; }).join("");
    return `<button type="button" class="hp${x === td ? " td" : ""}${calPick === x ? " on" : ""}" data-p="${x}" aria-label="${fullDay(x)}"><span class="hpp">${segs}</span><b>${wkDay(x)}</b><span class="num">${wxDay(x).hi}°</span>${wxIco(wxIcon(code), 18)}</button>`;
  }).join("");
  /* a tapped day lists its three scores beneath */
  const w = calPick && wxDay(calPick);
  const picked = w ? `<div class="pdet"><div class="s num"><b>${fullDay(calPick)}</b> ${wxLabel(w.code)}, H ${w.hi}° L ${w.lo}°, rain ${w.p}%</div><div class="pills">${WX_BLOCKS.map(b => { const B = wxBlock(calPick, b); return `<span class="pill num${B ? wxGood(B.score) : ""}">${b.label} ${B ? B.score : "past"}</span>`; }).join("")}</div></div>`
    : `<div class="s" style="padding:10px 2px 0">Tap a day for its morning, afternoon, and evening scores.</div>`;
  return { head, strip, score: `<div class="h2">Outdoor Score Today<span>65 or higher is green</span></div><div class="bks">${tiles}</div>`,
    week: `<div class="h2">Next 7 Days<span>Morning, afternoon, evening</span></div><div class="hps">${pills}</div>${picked}`,
    source: `<div class="srcl">${wxTag()}<span>Open-Meteo, Hoboken, read ${esc(wxRead)}</span></div>` };
}
function drawCalendar() {
  const td = today(), ev = cal.events.filter(e => e.d === td), ahead = cal.events.filter(e => e.d > td), side = $("wk") ? $("wk").scrollLeft : 0;
  const wx = W ? calWeather() : { head: "", strip: "", score: "", week: "", source: `<div class="srcl"><span>Weather is unavailable. Tap the Calendar tab to try again.</span></div>` };
  const row = e => `<div class="ev"><i></i><div class="grow"><b class="ell">${esc(e.title)}</b><span class="num">${esc(calWhen(e))}</span></div></div>`;
  const next = ahead.slice(0, 5).map(e => `<div class="up"><span class="dt"><b>${wkDay(e.d)}</b><span class="num">${monDay(e.d)}</span></span><span class="t grow ell">${esc(e.title)}</span><span class="meta num">${esc(e.start) || relDay(e.d)}</span></div>`).join("");
  const seg = `<div class="seg">${["Today", "Next Up"].map(v => `<button type="button" data-v="${v}" class="${v === calView ? "on" : ""}"${v === calView ? ' aria-current="true"' : ""}>${v}</button>`).join("")}</div>`;
  const src = `${wx.source}<div class="srcl"><span>Google Calendar, synced ${esc(cal.synced)}</span></div>`;
  $("main").innerHTML = seg + (calView === "Today" ? `<div class="big" style="padding-bottom:0">${fullDay(td)}</div><div class="s" style="padding:0 2px 12px">Today, ${ev.length ? `${ev.length} event${ev.length > 1 ? "s" : ""}` : "nothing scheduled"}</div>
    <div class="card">${ev.map(row).join("") || `<div class="s">Nothing scheduled today</div>`}${wx.head}</div>
    ${wx.strip}${wx.score}${src}`
    : `<div class="h2">Next Up<span class="num">${ahead.length} ahead</span></div>${next || `<div class="s" style="padding:0 2px">Nothing further in the synced range.</div>`}
    ${wx.week}${src}`);
  if ($("wk")) $("wk").scrollLeft = side;
}
async function loadCalendar() {
  const [f] = await Promise.all([readFile(CAL_FILE), loadWeather()]);
  if (tab !== "Calendar") return;
  cal = parseCalendar(f.text); calPick = null;
  status(f.at ? `Offline. Showing the calendar loaded ${f.at}.` : "Synced " + stamp().split(", ").pop(), f.at ? "err" : "ok");
  drawCalendar();
}

/* ---------- tabs. A screen has load() to fetch and draw itself, and may have add() for the add button and leave() ---------- */
const soon = name => ({ load: async () => { status(""); $("main").innerHTML = `<div class="big">${name}</div><div class="empty">${name} is not built yet.</div>`; } });
const SCREENS = { Home: soon("Home"), Calendar: { load: loadCalendar }, Habits: soon("Habits"), Tasks: soon("Tasks"), Notes: { load: loadNotes, add: newNote, leave: leaveNotes } };
const START = "Notes"; /* becomes Home once that screen is built */
let tab = null;
function leave() { const s = SCREENS[tab]; if (s && s.leave) s.leave(); }
async function go(name) {
  leave();
  tab = SCREENS[name] ? name : START;
  history.replaceState(null, "", "#" + tab.toLowerCase());
  $("tabs").innerHTML = Object.keys(TAB).map(n => `<button class="tab${n === tab ? " on" : ""}" type="button" data-tab="${n}" aria-label="${n}"${n === tab ? ' aria-current="page"' : ""}><span class="w">${svg(TAB[n], 24)}</span></button>`).join("");
  $("fab").hidden = true; $("scr").scrollTop = 0;
  if (!cfg().token) return showSetup();
  status("Loading…");
  try { await SCREENS[tab].load(); }
  catch (e) { status(e.message, "err"); if (/token|repository/i.test(e.message)) showSetup(e.message); }
}
function showSetup(msg) {
  const c = cfg();
  leave(); status(""); $("fab").hidden = true;
  $("main").innerHTML = `<div class="big">Settings</div><form class="card setup" id="setup">
    ${msg ? `<p style="color:var(--flag)">${esc(msg)}</p>` : ""}
    <p>Paste the GitHub token for the mattos-data repository. It is stored only in this browser.</p>
    <label>Token<input id="s-token" type="password" value="${esc(c.token)}" autocomplete="off" required></label>
    <label>GitHub username<input id="s-owner" value="${esc(c.owner)}" autocomplete="off" autocapitalize="off"></label>
    <label>Repository<input id="s-repo" value="${esc(c.repo)}" autocomplete="off" autocapitalize="off"></label>
    <button class="btn primary" type="submit">Save and Connect</button></form>`;
}

/* events */
document.addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if (t) { go(t.dataset.tab); return; } /* tapping the open tab reloads it */
  if (e.target.closest("#settings")) { showSetup(); return; }
  if (e.target.closest("#fab")) { const s = SCREENS[tab]; if (s.add) s.add(); return; }
  const dv = e.target.closest("[data-v]");
  if (dv) { calView = dv.dataset.v; $("scr").scrollTop = 0; drawCalendar(); return; }
  const dp = e.target.closest("[data-p]");
  if (dp) { calPick = calPick === dp.dataset.p ? null : dp.dataset.p; drawCalendar(); return; }
  const n = e.target.closest(".note");
  if (n) { showNote(n.dataset.id); return; }
  if (e.target.closest("#back")) { leaveNotes(); showNoteList(); return; }
  if (e.target.closest("#del")) {
    const id = openId, gone = notes.find(x => x.id === id);
    undoNote = gone ? { ...gone, title: $("ntitle").value, body: $("nbody").value } : null;
    clearTimeout(saveTimer); openId = null;
    notes = notes.filter(x => x.id !== id); showNoteList();
    toast("Note deleted");
    commitNotes(list => { const i = list.findIndex(x => x.id === id); if (i >= 0) list.splice(i, 1); }, `Phone: delete "${gone ? gone.title || "Untitled" : id}"`);
    return;
  }
  if (e.target.closest("#undo") && undoNote) {
    const back = undoNote; undoNote = null; $("toast").hidden = true;
    notes.unshift(back); if (tab === "Notes" && !openId) showNoteList();
    commitNotes(list => { if (!list.some(x => x.id === back.id)) list.unshift(back); }, `Phone: restore "${back.title || "Untitled"}"`);
  }
});
document.addEventListener("input", e => {
  if (e.target.id !== "ntitle" && e.target.id !== "nbody") return;
  status("Unsaved changes…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { if (dirty()) upsertOpenNote(); }, 1500);
});
document.addEventListener("submit", e => {
  if (e.target.id !== "setup") return;
  e.preventDefault();
  store.set("token", $("s-token").value.trim()); store.set("owner", $("s-owner").value.trim()); store.set("repo", $("s-repo").value.trim());
  go(tab);
});
/* save before the phone puts the page away; reload when it comes back */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (dirty()) { clearTimeout(saveTimer); upsertOpenNote(); } }
  else if (!openId && !$("setup") && cfg().token) go(tab);
});
function toast(msg) {
  $("toastmsg").textContent = msg; $("toast").hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("toast").hidden = true; undoNote = null; }, 8000);
}
/* sw.js keeps a copy of the app so that it opens with no signal */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
$("fab").innerHTML = svg(UI.plus, 24, 2.6);
go(Object.keys(TAB).find(n => n.toLowerCase() === location.hash.slice(1)) || START);
</script>
