  .wok::before { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--done); opacity: 0; animation: wRing .6s ease-out; }
  .wbar { display: block; height: 4px; margin-top: 6px; border-radius: 2px; background: var(--body); overflow: hidden; }
  .wbar i { display: block; height: 100%; width: var(--to); border-radius: 2px; background: var(--blue); animation: wFill .6s cubic-bezier(.2, .8, .2, 1) .1s both; }
  @keyframes wRing { 0% { transform: scale(.6); opacity: .8; } 100% { transform: scale(1.8); opacity: 0; } }
  @keyframes wFill { from { width: var(--from); } }
  /* the Kindle toast: after Matt submits a day's habits, the whole toast opens Kindle, then fades */
  .toast.kindle { gap: 14px; padding: 10px 16px 10px 10px; }
  .toast.kindle img { flex: none; border-radius: 10px; }
  .toast.kindle b { display: block; font-size: 14px; line-height: 18px; font-weight: 600; color: var(--hi); }
  .toast.kindle small { display: block; font-size: 12.5px; line-height: 16px; color: var(--mut); }
  /* the win toast (mobileWinToastV1, Green Pop): a green bar where the toast sits whose emoji pops; sad turns it red and droops the emoji, party adds confetti */
  .win { position: fixed; inset: 0; z-index: 7; pointer-events: none; overflow: hidden; }
  .wst { position: absolute; left: 16px; right: 16px; bottom: calc(var(--tabpad) + 70px); display: flex; align-items: center; gap: 12px; background: #10261d; border: 1px solid #1f5a3f; border-radius: 12px; padding: 10px 14px; box-shadow: 0 6px 20px rgba(0, 0, 0, .4); animation: wIn .3s ease-out both, wOut .3s ease-in 2.3s forwards; }
  .party .wst { animation-delay: 0s, 3.1s; }
  .wst b { display: block; font-size: 14px; line-height: 18px; font-weight: 600; color: var(--hi); }
  .wst small { display: block; font-size: 12.5px; line-height: 16px; color: #8fd9b6; }
  .wst .em { flex: none; font-size: 26px; line-height: 1; animation: wPop .5s ease-out .1s both; }
  .wst.sad { background: #2a1517; border-color: #5c2a2c; }
  .wst.sad small { color: #e6a3a0; }
  .wst.sad .em { animation: wDroop .5s ease-out .3s both; }
  .wcf i { position: absolute; top: 0; width: 7px; height: 11px; border-radius: 2px; animation: wFall 2.6s ease-in both; }
  @keyframes wIn { from { opacity: 0; transform: translateY(14px); } }
  @keyframes wOut { to { opacity: 0; transform: translateY(14px); } }
  @keyframes wPop { 0% { transform: scale(.2); } 60% { transform: scale(1.35); } 100% { transform: none; } }
  @keyframes wDroop { to { transform: translateY(3px) rotate(-14deg); } }
  @keyframes wFall { 0% { opacity: 0; transform: translateY(-40px) rotate(0); } 8%, 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(105vh) rotate(540deg); } }
  /* Meditation, the third view of Habits: the time left in big digits, the breath phase with its count, and a dot per phase */
  .med { display: flex; flex-direction: column; align-items: center; }
  .med .huge { font-size: 112px; line-height: 112px; font-weight: 200; color: var(--hi); letter-spacing: -.03em; margin-top: 70px; }
  .med .cue { margin-top: 26px; font-size: 26px; line-height: 32px; font-weight: 500; }
  .med .cue b { font-weight: 300; margin-left: 8px; }
  .med .dots { display: flex; gap: 8px; margin: 18px 0 54px; }
  .med .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--rule); }
  .med .dots span.on { background: currentColor; }
  .med .play { width: 76px; height: 76px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 22px rgba(59,110,245,.35); }
  .med .s { margin-top: 22px; }
  .med .rs { margin-top: 14px; } .med .rs:disabled { opacity: .4; }
  .med .vol { display: grid; gap: 12px; width: 100%; max-width: 300px; margin-top: 34px; }
  .med .vol label { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 12px; font-size: 14px; color: var(--mut); }
  .med .vol input { width: 100%; accent-color: var(--blue); }
  .ph-in { color: var(--acc); } .ph-hold { color: #b79cf7; } .ph-out { color: var(--done); }
</style>

/* MattOS for the phone. Reads and writes the registry files in the private mattos-data repository through the GitHub API.

/* solid style only: filled shapes, details cut out in the background colour, or heavy strokes */

/* the tab bar: Notes is the third word of Tasks, so its icon is used only on Home. CucuBarri's Shopping and Strength tabs are Tasks held on those views */
const CB = document.documentElement.classList.contains("cb");
const TAB_BAR = CB ? ["Home", "Yoni", "Tasks", "Shopping", "Strength"] : ["Home", "Calendar", "Habits", "Tasks", "Yoni"];
const UI = { down: `<path d="m6 9 6 6 6-6"/>`, plus:`<path d="M12 5v14M5 12h14"/>`, minus: `<path d="M5 12h14"/>`, left: `<path d="m15 5-7 7 7 7"/>`, right: `<path d="m9 5 7 7-7 7"/>`, filter: `<path d="M4 7h16M7 12h10M10 17h4"/>`, check: `<path d="m5 12.5 4.5 4.5L19 7"/>`, trash: `<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5a1.5 1.5 0 0 0 1.5 1.5h7a1.5 1.5 0 0 0 1.5-1.5L18 7M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7"/>`,bottle: `<path ${F} d="M9.5 2h5v3.2l2 2.6V20a2 2 0 0 1-2 2h-5a2 2 0 0 1-2-2V7.8l2-2.6z"/>` };
/* the five habit categories */
const CI = {
  water: `<path ${F} d="M12 2.5c3.5 4.2 6.5 7.6 6.5 11.5a6.5 6.5 0 0 1-13 0c0-3.9 3-7.3 6.5-11.5z"/>`,
  habits: `<circle ${F} cx="12" cy="12" r="9.5"/><path ${C} d="m7.8 12.3 2.8 2.8 5.6-6"/>`,
  food: `<path ${K(2.6)} d="M6 3v6a2.5 2.5 0 0 0 5 0V3M8.5 3v18M17 21V3c-2.2 1.5-3 4-3 8h3"/>`,
  fitness: `<path ${K(3.2)} d="M6 7v10M18 7v10"/><path ${K(2.6)} d="M2.5 10v4M21.5 10v4M6 12h12"/>`,
  mental: `<circle ${F} cx="12" cy="12" r="9.5"/><circle fill="none" stroke="var(--cut)" stroke-width="2.2" cx="12" cy="12" r="4"/>`
};

const $ = id => document.getElementById(id);
const esc = s => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
/* a task named [Name](https://...) shows its name and opens the link, and linked words inside a longer name show as links, as tLink in mattOs.html (screens.js) */
const T_LINKS = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g;
const tLink = s => String(s || "").match(/^\[(.+)\]\((https?:\/\/[^)\s]+)\)$/), tName = s => String(s || "").replace(T_LINKS, "$1");
const tRich = s => esc(String(s || "").replace(/<br\s*\/?>/gi, " ")).replace(T_LINKS, '<a class="tlink" href="$2" target="_blank" rel="noopener">$1</a>');
const stamp = () => { const d = new Date(), h = d.getHours(), m = d.getMinutes(); return `${d.toLocaleString("en-US", { month: "short" })} ${d.getDate()}, ${d.getFullYear()}, ${h % 12 || 12}${m ? ":" + String(m).padStart(2, "0") : ""}${h < 12 ? "am" : "pm"}`; };
function status(msg, kind = "") { $("status").textContent = msg; $("status").className = "status" + (kind ? " " + kind : ""); }

/* settings live in this browser only */
const store = {
  get: k => { try { return localStorage.getItem("mattos-" + k) || ""; } catch (e) { return ""; } },
  set: (k, v) => { try { localStorage.setItem("mattos-" + k, v); } catch (e) { /* private mode: lasts until the tab closes */ } }
};
const cfg = () => ({ owner: store.get("owner") || "matthewscannella", repo: store.get("repo") || "mattos-data", token: store.get("token") });

/* GitHub contents API. Every function takes the file's path in the repository */
const b64decode = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));
const b64encode = text => { const bytes = new TextEncoder().encode(text); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(bin); };
const apiUrl = path => { const c = cfg(); return `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}`; };
const headers = () => ({ Authorization: `Bearer ${cfg().token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" });
const keep = (path, text) => store.set("file-" + path, JSON.stringify({ text, at: stamp() }));
const PEEK = document.documentElement.classList.contains("peek");
async function fetchFile(path) {
  if (PEEK) { const r = await fetch("/mobile/data/" + path.split("/").map(encodeURIComponent).join("/"), { cache: "no-store" }); if (!r.ok) throw new Error(`${path.split("/").pop()} was not found.`); return { text: await r.text(), sha: null }; }
  const r = await fetch(apiUrl(path) + "?ref=main&t=" + Date.now(), { headers: headers(), cache: "no-store" });
  if (r.status === 401) throw new Error("The token was rejected. Open Settings and paste a new one.");
  if (r.status === 404) throw new Error(`${path.split("/").pop()} was not found. Check the repository name in Settings, and that the laptop has synced once.`);
  if (!r.ok) throw new Error(`GitHub returned ${r.status}.`);
  const j = await r.json(), text = b64decode(j.content);
  keep(path, text);
  return { text, sha: j.sha };
}
async function putFile(path, text, sha, message) {
  /* the peek panel saves to the laptop's file, and the desktop app reads it again at once */
  if (PEEK) { const r = await fetch("/mobile/data/" + path.split("/").map(encodeURIComponent).join("/"), { method: "POST", body: text }); if (!r.ok) throw new Error("Save failed on the laptop."); try { parent.refreshRegistries(); } catch (e) { /* opened on its own */ } return "local"; }
  const r = await fetch(apiUrl(path), { method: "PUT", headers: { ...headers(), "Content-Type": "application/json" }, body: JSON.stringify({ message, content: b64encode(text), sha, branch: "main" }) });
  if (r.status === 409 || r.status === 422) return null; /* someone else saved first: caller retries on the newer file */
  if (!r.ok) throw new Error(r.status === 403 ? "The token can't write to this repository. Give it Contents: Read and write." : `Save failed: GitHub returned ${r.status}.`);
  keep(path, text);
  return (await r.json()).content.sha;
}
/* for showing a screen: the newest file, or the copy kept from the last load when there is no connection. Nothing is edited from a kept copy */
let offline = false, quick = false;
async function readFile(path) {
  /* quick: go() first draws a screen from the copy kept on this phone, so a tab opens at once, then loads the newest file */
  if (quick) { const kept = JSON.parse(store.get("file-" + path)); return { text: kept.text, sha: null }; }
  try { const f = await fetchFile(path); setOffline(false); return f; }
  catch (e) {
    if (!(e instanceof TypeError)) throw e;
    let kept = null; try { kept = JSON.parse(store.get("file-" + path)); } catch (x) { /* nothing kept */ }
    if (!kept) throw new Error("No connection, and nothing has been loaded on this phone yet.");
    setOffline(true);
    return { text: kept.text, sha: null, at: kept.at };
  }
}
function setOffline(v) { offline = v; $("settings").classList.toggle("off", v); }
/* every save starts from the newest file on GitHub and changes only its own part, so laptop edits to the rest are kept.
   change(list) edits the parsed list in place and returns the item it touched */
let saving = Promise.resolve();
function commitFile(path, parse, serialize, change, message, onSaved) {
  saving = saving.then(async () => {
    status("Saving…");
    for (let attempt = 0; attempt < 4; attempt++) {
      const latest = await fetchFile(path);
      const list = parse(latest.text);
      const item = change(list);
      const text = serialize(list);
      if (text === latest.text) { if (onSaved) onSaved(item, list); status("Saved", "ok"); return item; }
      const newSha = await putFile(path, text, latest.sha, message);
      if (newSha) { if (onSaved) onSaved(item, list); status("Saved " + stamp().split(", ").pop(), "ok"); return item; }
    }
    throw new Error("Could not save after several tries. Check your connection, then tap the tab again.");
  }).catch(e => { status(e instanceof TypeError ? "No connection. This change was not saved." : e.message, "err"); });
  return saving;
}

/* ---------- Notes ---------- */
const NOTES_FILE = "03🗒️-notes/notesRegistry.md";
const NOTE_HEAD = `# Notes Registry\n\nSource of truth for MattOS notes. Newest first.\n`;
const serializeNotes = notes => NOTE_HEAD + notes.map(n => `\n---\n\n<!-- note: ${n.id} -->\n## ${n.title || ""}\n_Edited ${n.edited}_\n\n${n.body}\n`).join("");
function parseNotes(md) {
  const parts = md.split(/^<!-- note: (.+?) -->[ \t]*\r?$/m), out = [];
  for (let i = 1; i < parts.length; i += 2) {
    const lines = parts[i + 1].replace(/^\r?\n/, "").split(/\r?\n/);
    const tm = (lines[0] || "").match(/^##\s?(.*)$/);
    let k = tm ? 1 : 0;
    const em = (lines[k] || "").match(/^_Edited (.*)_$/);
    if (em) k++;
    if (lines[k] === "") k++;
    out.push({ id: parts[i].trim(), title: tm ? tm[1].trim() : "", edited: em ? em[1] : "", body: lines.slice(k).join("\n").replace(/\s*(\n---\s*)?$/, "") });
  }
  return out;
}
let notes = [], openId = null, base = null, saveTimer = null, undoNote = null, undoTask = null, toastTimer = null;
const commitNotes = (change, message, onSaved) => commitFile(NOTES_FILE, parseNotes, serializeNotes, change, message, (item, list) => { notes = list; if (onSaved) onSaved(item); });
const seen = {};
/* the file drops spaces and blank lines at the end of a title or body, so notes are compared the way the file stores them.
   Otherwise a save that lands just after a typed space looks like a laptop edit on the next save */
const filed = n => ({ title: (n.title || "").trim(), body: (n.body || "").replace(/\s*(\n---\s*)?$/, "") });
const differs = (a, b) => { a = filed(a); b = filed(b); return a.title !== b.title || a.body !== b.body; };
const dirty = () => openId && base && $("ntitle") && ($("ntitle").value !== base.title || noteText() !== base.body);
/* If the same note changed on the laptop since it was opened here, the phone's version is saved as a separate copy */
function upsertOpenNote() {
  if (!openId) return;
  const title = $("ntitle").value, body = noteText(), id = openId;
  let clash = false;
  commitNotes(list => {
    const i = list.findIndex(n => n.id === id), cur = list[i], start = seen[id];
    const mine = { id, title, body, edited: stamp() };
    clash = !!(cur && start && differs(cur, start) && differs(cur, mine));
    if (clash) {
      const copy = { ...mine, id: "n" + Date.now().toString(36), title: (title || "Untitled") + " (phone copy)" };
      list.unshift(copy);
      return copy;
    }
    if (cur) Object.assign(cur, mine); else list.unshift(mine);
    return mine;
  }, `Phone: edit "${title || "Untitled"}"`, saved => {
    seen[saved.id] = { title: saved.title, body: saved.body };
    if (openId === id) base = { title, body };
    if (clash && openId === id) {
      openId = saved.id; base = { title: saved.title, body };
      if ($("ntitle")) $("ntitle").value = saved.title;

    }
  });
}
function showNoteList() {
  leaveHabits(); openId = null; base = null; swOpen = null; $("fab").hidden = offline;
  $("main").innerHTML = tkBar("Notes") + (notes.length
    ? notes.map(n => `<div class="nsw">${offline ? "" : `<button class="ndel" type="button" data-hap data-del="${esc(n.id)}" aria-label="Delete ${esc(n.title) || "Untitled"}">${svg(UI.trash, 22)}</button>`}<button class="note" type="button" data-id="${esc(n.id)}"><b class="ell">${esc(n.title) || "Untitled"}</b><span class="s ell num">${esc(n.edited)}</span><span class="s ell">${esc(n.body.split("\n").find(l => l.trim())) || "Empty note"}</span></button></div>`).join("")
    : `<div class="empty">No notes yet. Tap the add button to start one.</div>`);
}
function showNote(id) {
  const n = notes.find(x => x.id === id);
  if (!n) return showNoteList();
  openId = id; base = { title: n.title, body: n.body }; seen[id] = { title: n.title, body: n.body };
  $("fab").hidden = true;
  const ro = offline ? " readonly" : "";
  $("main").innerHTML = `<div class="editor">
    <input id="ntitle" placeholder="Untitled" value="${esc(n.title)}" autocomplete="off" aria-label="Title"${ro}>
    <span class="s num">Edited ${esc(n.edited)}</span>
    <div id="nbody" class="nbody" role="textbox" aria-multiline="true" aria-label="Note" contenteditable="${offline ? "false" : "true"}" autocapitalize="sentences">${noteHtml(n.body)}</div></div>`;
  noteLayout(); base.body = noteText(); /* the note as this editor saves it, so opening one changes nothing */
  /* a bar above the tabs, like the Habits save bar: Done saves and goes back to the list */
  $("savebar").innerHTML = (offline ? "" : `<button class="sv ghost del" type="button" id="del" data-hap>Delete</button>`) + `<button class="sv ghost" type="button" id="ncopy" data-hap>Copy all</button><button class="sv ico" type="button" id="back">${svg(UI.check, 18, 2.6)}Done</button>`;
  $("savebar").hidden = false; $("scr").classList.add("hbs");
}
async function loadNotes() {
  const f = await readFile(NOTES_FILE);
  if (tab !== "Notes" || openId) return; /* a note opened while the list was loading stays open */
  notes = parseNotes(f.text);
  status(f.at ? `Offline. Showing notes loaded ${f.at}; changes are off until you reconnect.` : "Synced " + stamp().split(", ").pop(), f.at ? "err" : "ok");
  showNoteList();
}
function newNote() {
  const note = { id: "n" + Date.now().toString(36), title: "", edited: stamp(), body: "" };
  notes.unshift(note); showNote(note.id); $("ntitle").focus();
  commitNotes(list => { list.unshift({ ...note }); return note; }, "Phone: new note", () => { seen[note.id] = { title: "", body: "" }; });
}
/* called before the screen changes: an open note with unsaved typing is saved first */
function leaveNotes() { clearTimeout(saveTimer); if (dirty()) upsertOpenNote(); openId = null; base = null; leaveHabits(); }

/* ---------- dates ---------- */
const p2 = n => String(n).padStart(2, "0");
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const isoDay = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const atNoon = s => new Date(s + "T12:00");
const today = () => isoDay(new Date());
const addDays = (s, n) => { const d = atNoon(s); d.setDate(d.getDate() + n); return isoDay(d); };
const fmtDay = (s, o) => atNoon(s).toLocaleDateString("en-US", o);

const shortAt = s => {

};
const relDay = s => { const n = Math.round((atNoon(s) - atNoon(today())) / 864e5); return n === 0 ? "Today" : n === 1 ? "Tomorrow" : `In ${n} days`; };
const hr12 = h => `${h % 12 || 12} ${h < 12 ? "AM" : "PM"}`;

/* ---------- weather: the desktop app's Open-Meteo call for Hoboken, its outdoor score and its day blocks (PCAL_BLOCKS, wxScore, pcalWxFill) ---------- */
const WX_URL = "https://api.open-meteo.com/v1/forecast?latitude=40.744&longitude=-74.0324&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,apparent_temperature,weather_code,precipitation_probability,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FNew_York&forecast_days=16";
const WX_LABEL = { 0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Cloudy", 45: "Fog", 48: "Fog", 51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle", 61: "Light rain", 63: "Rain", 65: "Heavy rain", 66: "Freezing rain", 67: "Freezing rain", 71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains", 80: "Showers", 81: "Showers", 82: "Heavy showers", 85: "Snow showers", 86: "Snow showers", 95: "Thunderstorm", 96: "Thunderstorm, hail", 99: "Thunderstorm, hail" };
const cloudD = "M17.5 19a4.5 4.5 0 0 0 .5-8.97A6 6 0 0 0 6.3 11.5 3.8 3.8 0 0 0 7 19z";
const WXI = {
  sun: `<circle ${F} cx="12" cy="12" r="5"/><path ${K(2.6)} d="M12 2v1.5M12 20.5V22M4.9 4.9 6 6M18 18l1.1 1.1M2 12h1.5M20.5 12H22M4.9 19.1 6 18M18 6l1.1-1.1"/>`,

/* in any other text field, such as a task name, a link pasted over selected words becomes [words](link) */
document.addEventListener("paste", e => {
  const ta = e.target, url = ((e.clipboardData && e.clipboardData.getData("text")) || "").trim();
  if (e.defaultPrevented || !(ta.tagName === "TEXTAREA" || (ta.tagName === "INPUT" && ta.type === "text")) || ta.readOnly) return;
  if (ta.selectionStart === ta.selectionEnd || !NOTE_URL.test(url)) return;
  e.preventDefault(); document.execCommand("insertText", false, `[${ta.value.slice(ta.selectionStart, ta.selectionEnd)}](${url})`);
});
document.addEventListener("input", e => {
  if (e.target.id === "nbody" && e.inputType) { noteAuto(e); if (!e.isComposing) noteLayout(); requestAnimationFrame(noteSeen); }
  if (e.target.id !== "ntitle" && e.target.id !== "nbody") return;
  status("Unsaved changes…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { if (dirty()) upsertOpenNote(); }, 1500);
});
document.addEventListener("submit", e => {
  if (e.target.id === "tkform") { e.preventDefault(); saveSheet(); return; }
  if (e.target.id === "shadd") { e.preventDefault(); shAddTyped(); return; }
  if (e.target.id !== "setup") return;
  e.preventDefault();
  store.set("token", $("s-token").value.trim()); store.set("owner", $("s-owner").value.trim()); store.set("repo", $("s-repo").value.trim());
  go(here());
});
/* save before the phone puts the page away; reload when it comes back */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (dirty()) { clearTimeout(saveTimer); upsertOpenNote(); } }
  else if (tab === "Habits" && !$("setup") && cfg().token) loadHabits().catch(() => {}); /* in place, so a half-filled form keeps its position */
  else if (!openId && !$("setup") && !tk.sheet && cfg().token) go(here());
});
/* a haptic tap: navigator.vibrate where there is one (Android); strong is the win toast's longer pattern.
   iOS has no vibrate and gives a tap only when a finger taps a switch's label, so buttons marked data-hap become labels around a hidden switch */
function buzz(strong) {
  if (navigator.vibrate) navigator.vibrate(strong ? [40, 60, 40, 60, 80] : 12);
}
const hapify = () => document.querySelectorAll("button[data-hap]").forEach(b => {
  const l = document.createElement("label");
  for (const a of b.attributes) if (a.name !== "type") l.setAttribute(a.name, a.value);
  l.setAttribute("role", "button"); l.classList.add("hap"); l.innerHTML = '<input type="checkbox" switch style="display:none">'; l.append(...b.childNodes); b.replaceWith(l);
});
new MutationObserver(hapify).observe(document.body, { childList: true, subtree: true }); hapify();
/* the switch's own click is dropped, and the label's is handled a moment later, so a redraw cannot take the label away before its switch flips */
const hapLater = new WeakSet();
document.addEventListener("click", e => {
  if (e.target.matches("input[switch]")) { e.stopImmediatePropagation(); return; }
  if (!e.target.closest("label.hap") || hapLater.has(e)) return;
  e.stopImmediatePropagation();
  setTimeout(() => { const ev = new MouseEvent("click", { bubbles: true }); hapLater.add(ev); e.target.dispatchEvent(ev); });
}, true);
function toast(msg) {
  $("toast").className = "toast"; $("undo").hidden = false; $("toast").querySelector(":scope > img")?.remove();
  $("toastmsg").textContent = msg; $("toast").hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("toast").hidden = true; undoNote = null; undoTask = null; }, 8000);
}
/* the check-off toast (taskWinToastV1, Confetti Headline): a popping check, the name, the count, and a bar that fills to the new share. Undo shows for tasks only, and it all goes after 2.5 seconds */
function winToast({ title, meta, from, to, undo }) {
  const pc = n => Math.round(Math.max(0, Math.min(1, n)) * 100) + "%";
  toast(""); $("toast").classList.add("tick"); $("undo").hidden = !undo;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("toast").hidden = true; undoNote = null; undoTask = null; }, 2500);
  $("toastmsg").innerHTML = `<i class="wok"></i><b class="ell">${esc(title)}</b><small>${esc(meta)}</small><em class="wbar" style="--from:${pc(from)};--to:${pc(to)}"><i></i></em>`;
}
/* today's tasks in the ticked task's file are those set for today plus anything else checked off today and still done, kept on the phone by date since tasks have no done date */
function taskWin(r) {
  const d = new Date().toDateString(), day = TK_TIMES[(new Date().getDay() + 6) % 7];
  /* a task from another day keeps its Undo but reports nothing on today's count */
  if (r.time !== day) { toast("Checked off"); return; }
  let s = null;
  try { s = JSON.parse(localStorage.getItem("mattos.winDay") || "null"); } catch (e) { /* start the day afresh */ }
  if (!s || s.d !== d) s = { d, t: [] };
  if (!s.t.includes(r.title)) { s.t.push(r.title); localStorage.setItem("mattos.winDay", JSON.stringify(s)); }
  /* a done task counts only if checked off today, since done tasks from past weeks keep their weekday; only ticking one of today's own tasks can clear the day */
  const pool = tk.rows.filter(x => x.f === r.f && x.title && (x.st === "Done" ? s.t.includes(x.title) : x.time === day));
  const n = pool.filter(x => x.st === "Done").length, of = pool.length;
  winToast({ title: r.title, meta: `${n} of ${of} done today`, from: (n - 1) / of, to: n / of, undo: true });
  if (n === of && r.time === day) win({ em: "🎉", head: "Day cleared", sub: `All ${of} task${of === 1 ? "" : "s"} done. Enjoy the evening.`, party: true });
}
let winTimer = null;
function win({ em, head, sub, sad, party }) {
  const CF = ["#3fcf8e", "#8dabf9", "#f9c74f", "#f97066", "#c084fc"];
  const conf = party ? `<div class="wcf">${Array.from({ length: 30 }, (_, i) => `<i style="left:${(i * 37) % 100}%;background:${CF[i % 5]};animation-delay:${(i % 7) * .07}s"></i>`).join("")}</div>` : "";
  const el = $("win");
  el.className = "win" + (party ? " party" : "");
  el.innerHTML = `<div class="wst${sad ? " sad" : ""}"><span class="em">${em}</span><div><b>${esc(head)}</b><small>${esc(sub)}</small></div></div>${conf}`;
  el.hidden = false; buzz(true); clearTimeout(winTimer); winTimer = setTimeout(() => { el.hidden = true; }, party ? 3500 : 2700);
}
/* sw.js keeps a copy of the app so that it opens with no signal */
/* in the desktop peek panel, Alt+Right and Esc go to the desktop app, which closes the panel */
if (PEEK) document.addEventListener("keydown", e => { try { parent.peekKey(e); } catch (err) { /* opened on its own */ } });
if ("serviceWorker" in navigator && !PEEK) navigator.serviceWorker.register("sw.js").catch(() => {});
if (CB) { $("hdname").textContent = "CucuBarri"; $("hdlogo").src = "tablet-icon-180.png"; }
go(Object.keys(TAB).find(n => n.toLowerCase() === location.hash.slice(1)) || START);
